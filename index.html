async function fetchPlantImage(koreanName, scientificName) {
  // Wikipedia pageimages API - 가장 안정적
  async function wikiImg(lang, title) {
    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=600&origin=*`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data.query?.pages;
      if (!pages) return null;
      const page = Object.values(pages)[0];
      return page?.thumbnail?.source || null;
    } catch { return null; }
  }
  // Wikipedia 검색 API - 제목이 정확하지 않을 때
  async function wikiSearch(lang, q) {
    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1&format=json&origin=*`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const title = data.query?.search?.[0]?.title;
      if (!title) return null;
      return wikiImg(lang, title);
    } catch { return null; }
  }

  const sci = scientificName ? scientificName.split(' ').slice(0,2).join(' ') : null;

  // 순서대로 시도
  const attempts = [
    sci ? ()=>wikiImg('en', sci) : null,
    ()=>wikiSearch('en', sci||koreanName),
    ()=>wikiImg('ko', koreanName),
    ()=>wikiSearch('ko', koreanName),
    ()=>wikiSearch('en', koreanName),
  ].filter(Boolean);

  for (const attempt of attempts) {
    const img = await attempt();
    if (img) return img;
  }
  return null;
}

/* ── JSON 복구 함수 (잘린 경우 대비) ── */
function repairJson(str) {
  let s = str.trim();

  // 1차: 정상 파싱
  try { return JSON.parse(s); } catch(_) {}

  // 2차: 마지막 완전한 닫힘 위치까지 시도
  let depth = 0, inStr = false, esc = false, lastGoodIdx = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (esc) { esc = false; continue; }
    if (c === '\\' && inStr) { esc = true; continue; }
    if (c === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === '{' || c === '[') depth++;
    if (c === '}' || c === ']') { depth--; if (depth === 0) lastGoodIdx = i + 1; }
  }
  if (lastGoodIdx > 0) {
    try { return JSON.parse(s.slice(0, lastGoodIdx)); } catch(_) {}
  }

  // 3차: 잘린 문자열 닫기 + 배열/객체 강제 닫기
  let fixed = s;
  // 열린 문자열이 있으면 닫기
  let strOpen = false, escNow = false;
  for (let i = 0; i < fixed.length; i++) {
    if (escNow) { escNow = false; continue; }
    if (fixed[i] === '\\') { escNow = true; continue; }
    if (fixed[i] === '"') strOpen = !strOpen;
  }
  if (strOpen) fixed += '"';
  // 마지막 불완전 키-값 제거 (쉼표나 콜론으로 끝나는 경우)
  fixed = fixed.replace(/,\s*"[^"]*"\s*:\s*$/, '');
  fixed = fixed.replace(/,\s*"[^"]*"\s*$/, '');
  fixed = fixed.replace(/,\s*$/, '');
  // 열린 배열/객체 닫기
  const opens2 = (fixed.match(/{/g)||[]).length - (fixed.match(/}/g)||[]).length;
  const aopens2 = (fixed.match(/\[/g)||[]).length - (fixed.match(/\]/g)||[]).length;
  for (let i = 0; i < Math.max(0, aopens2); i++) fixed += ']';
  for (let i = 0; i < Math.max(0, opens2); i++) fixed += '}';
  try { return JSON.parse(fixed); } catch(_) {}

  // 4차: 첫 { 부터 마지막 } 까지만
  const first = s.indexOf('{'), last = s.lastIndexOf('}');
  if (first >= 0 && last > first) {
    try { return JSON.parse(s.slice(first, last + 1)); } catch(_) {}
  }

  // 5차: 부분 데이터라도 반환 (핵심 필드만 추출)
  const partial = {};
  const fields = ['cropName','problemType','problemName','severity','description','urgency'];
  fields.forEach(key => {
    const m = s.match(new RegExp(`"${key}"\\s*:\\s*"([^"]*)"` ));
    if (m) partial[key] = m[1];
  });
  if (Object.keys(partial).length > 0) {
    partial.diagnosed = true;
    partial._truncated = true;
    partial.applicationMethod = partial.applicationMethod || "응답이 잘려 일부 정보만 표시됩니다.";
    return partial;
  }

  throw new Error("응답 파싱 실패. 다시 시도해주세요.");
}

async function callGemini(parts, apiKey) {
  // gemini-2.0-flash-lite는 404(서비스 종료) 확인으로 제거
  const MODELS = [
    "gemini-2.5-flash",
    "gemini-2.0-flash",
  ];
  let lastError = null;
  for (const model of MODELS) {
    // 모든 키 형식(AIzaSy / AQ.)에 x-goog-api-key 헤더 방식 통일
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const headers = {"Content-Type":"application/json","x-goog-api-key":apiKey};
    let res;
    try {
      res = await fetch(url, {
        method:"POST",
        headers,
        body:JSON.stringify({
          contents:[{parts}],
          generationConfig:{temperature:0.1,maxOutputTokens:4096}
        })
      });
    } catch(e) {
      throw new Error("네트워크 오류: 인터넷 연결을 확인해주세요.");
    }
    if(res.status === 401) {
      throw new Error("❌ API 키가 올바르지 않습니다.\n\naistudio.google.com/apikey 에서 키를 다시 복사해 붙여넣어 주세요.");
    }
    if(res.status === 403) {
      throw new Error("❌ API 키 권한 오류 (403)\n\n회사·학교 계정은 제한될 수 있습니다.\n개인 Gmail로 새 키를 발급해보세요.");
    }
    if(res.status === 404) {
      const err = await res.json().catch(()=>({}));
      lastError = err?.error?.message || `모델 ${model} 없음`;
      continue;
    }
    if(res.status === 429) {
      const err = await res.json().catch(()=>({}));
      const msg = err?.error?.message || "";
      const retryMatch = msg.match(/retry in ([\d.]+)s/i);
      const wait = retryMatch ? Math.ceil(parseFloat(retryMatch[1])) : 60;
      if(wait <= 120) {
        throw new Error(`⏳ 분당 요청 한도 초과 (RPM)\n\n${wait}초 후 다시 시도해주세요.\n\n💡 같은 키를 여러 기기에서 동시에 사용 중이면 빨리 소진됩니다.`);
      } else {
        throw new Error(`📅 오늘 일일 사용량 소진\n\n✅ 확인: aistudio.google.com/usage\n🔄 리셋: 매일 오전 9시 (UTC 자정)\n\n💡 새 Gmail 계정으로 새 키를 발급하면 즉시 사용 가능합니다.`);
      }
    }
    if(!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err?.error?.message || `API 오류 (${res.status})`);
    }
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const clean = text.replace(/```json|```/g,"").trim();
    try { return JSON.parse(clean); } catch(_) {}
    return repairJson(clean);
  }
  throw new Error(`모든 모델 접속 실패.\n마지막 오류: ${lastError}\n\nAPI 키를 다시 확인해주세요.`);
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=()=>rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

function todayStr(){return new Date().toISOString().split("T")[0];}
function dateStr(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
function getDaysUntilWatering(plant){
  if(!plant.lastWatered)return -99;
  const last=new Date(plant.lastWatered),today=new Date();
  today.setHours(0,0,0,0);last.setHours(0,0,0,0);
  return (plant.wateringDays||3)-Math.floor((today-last)/86400000);
}
function getWateringAdvice(weather){
  if(!weather)return null;
  const{precipitation,temperature,humidity}=weather;
  if(precipitation>=5)return{text:"오늘 비가 충분히 왔어요. 물주기 불필요!",color:C.sky,icon:"🌧️"};
  if(precipitation>0)return{text:"비가 조금 왔어요. 토양 확인 후 필요시만 물주기.",color:C.sageDark,icon:"🌦️"};
  if(temperature>=30)return{text:"고온 주의! 아침 일찍 충분히 물을 주세요.",color:C.terra,icon:"🌡️"};
  if(humidity<40)return{text:"건조한 날씨. 물주기가 필요합니다.",color:C.gold,icon:"💨"};
  return{text:"적절한 날씨. 일정에 따라 물을 주세요.",color:C.sageDark,icon:"✅"};
}

/* ── localStorage 유틸 ── */
function loadStorage(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveStorage(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}



/* ── 기상청 Lambert 격자 변환 ── */
function latLonToGrid(lat, lon) {
  const RE=6371.00877, GRID=5.0, SLAT1=30.0, SLAT2=60.0;
  const OLON=126.0, OLAT=38.0, XO=43, YO=136;
  const DEGRAD=Math.PI/180.0;
  const re=RE/GRID, slat1=SLAT1*DEGRAD, slat2=SLAT2*DEGRAD;
  const olon=OLON*DEGRAD, olat=OLAT*DEGRAD;
  let sn=Math.tan(Math.PI*0.25+slat2*0.5)/Math.tan(Math.PI*0.25+slat1*0.5);
  sn=Math.log(Math.cos(slat1)/Math.cos(slat2))/Math.log(sn);
  let sf=Math.tan(Math.PI*0.25+slat1*0.5);
  sf=Math.pow(sf,sn)*Math.cos(slat1)/sn;
  let ro=Math.tan(Math.PI*0.25+olat*0.5);
  ro=re*sf/Math.pow(ro,sn);
  let ra=Math.tan(Math.PI*0.25+lat*DEGRAD*0.5);
  ra=re*sf/Math.pow(ra,sn);
  let theta=lon*DEGRAD-olon;
  if(theta>Math.PI) theta-=2.0*Math.PI;
  if(theta<-Math.PI) theta+=2.0*Math.PI;
  theta*=sn;
  return {
    nx: Math.floor(ra*Math.sin(theta)+XO+0.5),
    ny: Math.floor(ro-ra*Math.cos(theta)+YO+0.5)
  };
}

/* ── 기상청 기준 시각 계산 ── */
function getKmaBaseTime() {
  const now=new Date();
  const h=now.getHours(), m=now.getMinutes();
  const bases=[2,5,8,11,14,17,20,23];
  let base=bases.filter(b=>h>b||(h===b&&m>=10)).pop();
  if(base===undefined) base=23; // 자정 이전이면 전날 23시
  const date=new Date(now);
  if(base===23&&h<2) date.setDate(date.getDate()-1);
  const y=date.getFullYear();
  const mo=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return {
    base_date:`${y}${mo}${d}`,
    base_time:`${String(base).padStart(2,"0")}00`
  };
}

/* ── API 키 설정 화면 ── */
const ApiKeySetup=({onSave})=>{
  const[key,setKey]=useState("");
  const[testing,setTesting]=useState(false);
  const[error,setError]=useState("");
  const test=async()=>{
    if(!key.trim())return;
    setTesting(true);setError("");
    try{
      await callGemini([{text:`"장미"의 한국어 이름만 JSON으로 반환하세요. {"koreanName":"장미"}`}],key.trim());
      onSave(key.trim());
    }catch(e){
      // 429 한도 초과 → 키는 정상이므로 그냥 입장
      if(e.message.includes("한도 초과")||e.message.includes("429")||e.message.includes("quota")){
        onSave(key.trim());
        return;
      }
      setError("API 키가 유효하지 않습니다: "+e.message);
    }
    finally{setTesting(false);}
  };
  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${C.cream},#EFF5EB)`,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.12)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:8}}>🌿</div>
          <div style={{fontSize:22,fontWeight:900,color:C.moss}}>나의 정원 도감</div>
          <div style={{fontSize:13,color:C.inkLight,marginTop:6}}>Gemini API 키를 입력하면 시작됩니다</div>
        </div>
        <div style={{background:C.goldLight+"50",borderRadius:12,padding:"12px 14px",marginBottom:20,border:`1px solid ${C.gold}50`}}>
          <div style={{fontWeight:700,color:C.ink,fontSize:13,marginBottom:6}}>📋 API 키 발급 방법</div>
          <div style={{fontSize:12,color:C.inkLight,lineHeight:1.8}}>
            1. <a href="https://aistudio.google.com/app/apikey" target="_blank" style={{color:C.sky}}>aistudio.google.com/app/apikey</a> 접속<br/>
            2. Google 계정 로그인<br/>
            3. "Create API Key" 클릭<br/>
            4. 키 복사 후 아래에 붙여넣기
          </div>
          <div style={{marginTop:8,fontSize:11,color:C.teal,fontWeight:600}}>✅ 카드 등록 불필요 · 무료 사용 가능 (한도는 AI Studio에서 확인)</div>
        </div>
        <div style={{marginBottom:14}}>
          <STitle>Gemini API 키</STitle>
          <input value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&test()}
            placeholder="AIza..."
            type="password"
            style={{...inputSt,marginBottom:8}}/>
          {error&&<div style={{fontSize:12,color:C.rose,padding:"6px 10px",background:C.roseLight,borderRadius:6}}>{error}</div>}
        </div>
        <button onClick={test} disabled={!key.trim()||testing}
          style={{width:"100%",padding:13,background:testing?C.inkLight:`linear-gradient(135deg,${C.moss},${C.sageDark})`,color:"#fff",border:"none",borderRadius:12,fontWeight:700,fontSize:15,cursor:testing?"wait":"pointer"}}>
          {testing?"🔍 확인 중...":"🌿 시작하기"}
        </button>
        <div style={{textAlign:"right",marginTop:10,fontSize:11,color:C.inkLight}}>v55</div>
      </div>
    </div>
  );
};

const InfoGrid=({data})=>{
  const rows=[["🌿 분류",[data.order,data.family,data.genus].filter(Boolean).join(" · ")],["📅 개화 시기",data.bloomSeason],["🎨 꽃 색상",data.bloomColor],["📏 키",data.height],["☀️ 햇빛",data.sunlight],["💧 물주기",data.watering],["🌱 토양",data.soil],["⭐ 난이도",data.difficulty]].filter(([,v])=>v&&v!=="-");
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,margin:"12px 0"}}>{rows.map(([label,value])=><div key={label} style={{background:C.cream,borderRadius:8,padding:"8px 12px",border:`1px solid ${C.sageLight}55`}}><div style={{fontSize:11,color:C.inkLight,marginBottom:2}}>{label}</div><div style={{fontSize:13,color:C.ink,fontWeight:600}}>{value}</div></div>)}</div>;
};
const PropCard=({prop})=>{
  if(!prop)return null;
  return(
    <div style={{background:`linear-gradient(135deg,${C.sageLight}20,${C.goldLight}40)`,border:`1px solid ${C.sageLight}`,borderRadius:12,padding:14,marginTop:10}}>
      <div style={{fontWeight:700,color:C.moss,marginBottom:8,fontSize:14}}>🌱 번식 방법</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}><Badge color={C.sageDark}>권장: {prop.recommended}</Badge><ShockBadge level={prop.shockLevel||"보통"}/></div>
      {prop.seedInfo&&<div style={{fontSize:13,color:C.inkLight,marginBottom:4}}><strong style={{color:C.ink}}>씨앗:</strong> {prop.seedInfo}</div>}
      {prop.seedlingInfo&&<div style={{fontSize:13,color:C.inkLight,marginBottom:4}}><strong style={{color:C.ink}}>모종:</strong> {prop.seedlingInfo}</div>}
      {prop.transplantShockDetail&&<div style={{fontSize:12,color:C.terra,marginTop:6,padding:"6px 10px",background:C.terraLight+"60",borderRadius:6,borderLeft:`3px solid ${C.terra}`}}><strong>뿌리몸살:</strong> {prop.transplantShockDetail}</div>}
    </div>
  );
};
const PlantCard=({data,onSave,saved,confidence,plantImg})=>(
  <div style={{background:"#fff",borderRadius:16,border:`1px solid ${C.sageLight}`,overflow:"hidden",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
    {plantImg&&(
      <div style={{position:"relative",height:200,overflow:"hidden",background:C.cream}}>
        <img src={plantImg} alt={data.koreanName}
          style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
          onError={e=>{e.target.parentElement.style.display="none";}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:60,background:"linear-gradient(transparent,rgba(0,0,0,0.4))"}}/>
        <div style={{position:"absolute",bottom:8,left:12,color:"#fff",fontSize:10,opacity:0.7}}>📷 Wikipedia</div>
      </div>
    )}
    <div style={{background:`linear-gradient(135deg,${C.moss},${C.sageDark})`,padding:"16px 20px",color:"#fff"}}>
      {confidence&&<div style={{fontSize:11,opacity:0.7,marginBottom:4}}>식별 신뢰도: {confidence}</div>}
      <div style={{fontSize:20,fontWeight:800}}>{data.koreanName}</div>
      <div style={{fontSize:13,opacity:0.85,fontStyle:"italic",marginTop:2}}>{data.scientificName}</div>
      <div style={{fontSize:12,opacity:0.7}}>{data.englishName}</div>
    </div>
    <div style={{padding:"14px 16px"}}>
      {data.description&&<p style={{fontSize:13,color:C.inkLight,marginBottom:10}}>{data.description}</p>}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
        {data.lifespan&&<Badge color={C.terra}>{data.lifespan}</Badge>}
        {data.bloomSeason&&data.bloomSeason!=="-"&&<Badge color={C.sage}>🌸 {data.bloomSeason}</Badge>}
        {data.difficulty&&<Badge color={C.gold}>난이도: {data.difficulty}</Badge>}
        {data.wateringDays&&<Badge color={C.sky}>💧 {data.wateringDays}일마다</Badge>}
      </div>
      <InfoGrid data={data}/>
      <PropCard prop={data.propagation}/>
      {data.features?.length>0&&<div style={{marginTop:10}}><STitle>특징</STitle><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{data.features.map(f=><Badge key={f} color={C.inkLight}>{f}</Badge>)}</div></div>}
      {data.careNotes&&<div style={{marginTop:10,fontSize:13,color:C.inkLight,background:C.goldLight+"50",borderRadius:8,padding:"8px 12px",borderLeft:`3px solid ${C.gold}`}}><strong style={{color:C.ink}}>💡 관리 팁:</strong> {data.careNotes}</div>}
      {data.companionPlants?.length>0&&<div style={{marginTop:10}}><STitle>🌸 함께 심으면 좋은 식물</STitle><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{data.companionPlants.map(p=><Badge key={p} color={C.sageDark}>{p}</Badge>)}</div></div>}
      <div style={{marginTop:14,display:"flex",gap:8}}>
        <button onClick={()=>onSave(data,"have")}
          style={{flex:1,padding:"10px 0",background:saved==="have"?C.sageLight:C.sageDark,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>
          {saved==="have"?"✅ 내 정원에 있음":"🌱 내 정원에 추가"}
        </button>
        <button onClick={()=>onSave(data,"wish")}
          style={{flex:1,padding:"10px 0",background:saved==="wish"?"#C08EC0":"#fff",color:saved==="wish"?"#fff":C.purple,border:`1.5px solid ${C.purple}`,borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>
          {saved==="wish"?"🌸 위시 가든에 있음":"🌸 위시 가든"}
        </button>
      </div>
    </div>
  </div>
);

/* ── 식물 탭 (식별+검색) ── */
const PlantTab=({garden,onAdd,apiKey})=>{
  const[mode,setMode]=useState("search");
  const[query,setQuery]=useState("");
  const[imgFile,setImgFile]=useState(null);
  const[imgPreview,setImgPreview]=useState(null);
  const[result,setResult]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[plantImg,setPlantImg]=useState(null);
  const[recentSearches,setRecentSearches]=useState(()=>loadStorage("recent_searches",[])
  );
  const fileRef=useRef(null);
  const camRef=useRef(null);
  const gardenStatus=n=>{
    const p=garden.find(x=>x.koreanName===n);
    if(!p) return null;
    return p.status==="wish"?"wish":"have";
  };

  const handleSearch=async(q)=>{
    if(loading) return;  // 연타 방지
    const qr=(q!==undefined?q:query).trim();
    if(!qr)return;
    setLoading(true);setError("");setResult(null);setPlantImg(null);
    try{
      const r=await callGemini([{text:FLOWER_PROMPT(qr)}],apiKey);
      setResult(r);
      fetchPlantImage(r.koreanName, r.scientificName).then(img=>{ if(img) setPlantImg(img); });
      // 최근 검색 저장 — fullData 전체 포함 (캐시용)
      setRecentSearches(prev=>{
        const entry={koreanName:r.koreanName,scientificName:r.scientificName,bloomSeason:r.bloomSeason,lifespan:r.lifespan,difficulty:r.difficulty,fullData:r};
        const filtered=prev.filter(x=>x.koreanName!==r.koreanName);
        const next=[entry,...filtered].slice(0,10);
        saveStorage("recent_searches", next);
        return next;
      });
    }
    catch(e){setError("검색 오류: "+e.message);}
    finally{setLoading(false);}
  };

  // 캐시 우선 로드 — API 호출 없이 저장된 결과 바로 표시
  const loadFromCache=(r)=>{
    setQuery(r.koreanName);
    if(r.fullData){
      setResult(r.fullData);
      setPlantImg(null);
      fetchPlantImage(r.fullData.koreanName, r.fullData.scientificName).then(img=>{ if(img) setPlantImg(img); });
    } else {
      handleSearch(r.koreanName);
    }
  };

  const handleImgSelect=e=>{
    const f=e.target.files?.[0];
    if(!f)return;
    setImgFile(f);setImgPreview(URL.createObjectURL(f));
    setResult(null);setError("");
  };

  const handleIdentify=async()=>{
    if(loading) return;  // 연타 방지
    if(!imgFile)return;
    setLoading(true);setError("");setResult(null);
    try{
      const b64=await fileToBase64(imgFile);
      const r=await callGemini([{inlineData:{mimeType:imgFile.type||"image/jpeg",data:b64}},{text:IDENTIFY_PROMPT}],apiKey);
      if(r.identified===false){setError(r.message||"식별하기 어렵습니다.");}
      else{setResult(r);}
    }catch(e){setError("식별 오류: "+e.message);}
    finally{setLoading(false);}
  };

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:14,background:"#fff",borderRadius:12,padding:5,border:`1px solid ${C.sageLight}`}}>
        {[["search","🔍 이름 검색"],["identify","📸 사진 식별"]].map(([m,l])=>(
          <button key={m} onClick={()=>{setMode(m);setResult(null);setError("");setImgPreview(null);setImgFile(null);setPlantImg(null);}}
            style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",background:mode===m?C.sageDark:"transparent",color:mode===m?"#fff":C.inkLight,fontWeight:700,fontSize:13,cursor:"pointer"}}>{l}</button>
        ))}
      </div>
      {mode==="search"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSearch()}
              placeholder="식물 이름 입력 (한글·영문·학명)"
              style={{flex:1,padding:"12px 14px",fontSize:14,border:`1.5px solid ${C.sageLight}`,borderRadius:10,outline:"none",background:"#fff",color:C.ink}}/>
            <button onClick={()=>handleSearch()} disabled={loading||!query.trim()}
              style={{padding:"12px 16px",background:loading?C.inkLight:C.sageDark,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:14,cursor:loading?"wait":"pointer"}}>{loading?"⏳":"🔍"}</button>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:recentSearches.length>0?10:14}}>
            {["튤립","장미","수국","라벤더","코스모스","무화과","다알리아","국화","라넌큘러스","아네모네"].map(n=>{
              const cached=recentSearches.find(r=>r.koreanName===n);
              return(
                <button key={n} onClick={()=>{ if(loading) return; cached?loadFromCache(cached):(setQuery(n),handleSearch(n)); }}
                  style={{padding:"4px 11px",background:cached?C.sageDark+"15":C.cream,border:`1px solid ${cached?C.sageDark:C.sageLight}`,borderRadius:20,fontSize:12,cursor:loading?"not-allowed":"pointer",color:cached?C.sageDark:C.inkLight,opacity:loading?0.5:1}}>
                  {n}{cached&&<span style={{fontSize:9,marginLeft:2,color:C.sageDark}}>✓</span>}
                </button>
              );
            })}
          </div>
          {recentSearches.length>0&&(
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:12,color:C.inkLight,fontWeight:700}}>🕐 최근 검색</div>
                <button onClick={()=>{setRecentSearches([]);saveStorage("recent_searches",[]);}} style={{fontSize:11,color:C.terra,background:"none",border:"none",cursor:"pointer"}}>전체 삭제</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {recentSearches.map(r=>(
                  <button key={r.koreanName} onClick={()=>loadFromCache(r)}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"#fff",border:`1px solid ${C.sageLight}`,borderRadius:10,cursor:"pointer",textAlign:"left",width:"100%"}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,color:C.ink,fontSize:14}}>{r.koreanName}
                        {r.fullData&&<span style={{fontSize:10,color:C.teal,marginLeft:5,fontWeight:400}}>캐시</span>}
                      </div>
                      <div style={{fontSize:11,color:C.inkLight,fontStyle:"italic",marginTop:1}}>{r.scientificName}</div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,marginLeft:8}}>
                      {r.lifespan&&<span style={{fontSize:10,background:C.terra+"20",color:C.terra,borderRadius:10,padding:"1px 6px"}}>{r.lifespan}</span>}
                      {r.bloomSeason&&r.bloomSeason!=="-"&&<span style={{fontSize:10,background:C.sage+"20",color:C.sageDark,borderRadius:10,padding:"1px 6px"}}>🌸 {r.bloomSeason}</span>}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
      {mode==="identify"&&(
        <div style={{marginBottom:14}}>
          <div style={{background:"#fff",borderRadius:14,border:`1px solid ${C.sageLight}`,overflow:"hidden",marginBottom:10}}>
            {imgPreview?(
              <div style={{position:"relative"}}>
                <img src={imgPreview} alt="selected" style={{width:"100%",maxHeight:240,objectFit:"cover",display:"block"}}/>
                <button onClick={()=>{setImgPreview(null);setImgFile(null);setResult(null);}} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,0.5)",color:"#fff",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14}}>✕</button>
              </div>
            ):(
              <div style={{padding:"28px 20px",textAlign:"center",background:C.cream}}>
                <div style={{fontSize:44,marginBottom:8}}>🌿</div>
                <div style={{fontWeight:700,color:C.sageDark,fontSize:15,marginBottom:14}}>사진으로 식물 식별</div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>camRef.current?.click()} style={{flex:1,padding:"11px 0",background:C.sageDark,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>📸 카메라 촬영</button>
                  <button onClick={()=>fileRef.current?.click()} style={{flex:1,padding:"11px 0",background:"#fff",color:C.sageDark,border:`1.5px solid ${C.sageDark}`,borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>🖼️ 갤러리 선택</button>
                </div>
              </div>
            )}
            <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={handleImgSelect} style={{display:"none"}}/>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImgSelect} style={{display:"none"}}/>
            {imgPreview&&(
              <div style={{padding:"10px 14px"}}>
                <button onClick={handleIdentify} disabled={loading} style={{width:"100%",padding:11,background:loading?C.inkLight:C.sageDark,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:14,cursor:loading?"wait":"pointer"}}>
                  {loading?"🔍 식별 중...":"🌸 이 식물 식별하기"}
                </button>
              </div>
            )}
          </div>
        </div>
      )}
      {loading&&<div style={{textAlign:"center",padding:"30px 20px",color:C.sage}}><div style={{fontSize:36,marginBottom:8}}>🌿</div><div>AI가 분석 중...</div></div>}
      {error&&<div style={{background:"#FFF0EE",border:`1px solid ${C.terra}`,borderRadius:10,padding:"10px 14px",color:C.terra,fontSize:13,marginBottom:14}}>{error}</div>}
      {result&&!loading&&<PlantCard data={result} onSave={(p,st)=>onAdd(p,st)} saved={gardenStatus(result.koreanName)} confidence={result.confidence} plantImg={plantImg}/>}
      {!result&&!loading&&!error&&mode==="search"&&(
        <div style={{textAlign:"center",padding:"30px 20px",color:C.inkLight}}><div style={{fontSize:44,marginBottom:8}}>🌸</div><div style={{fontSize:14,fontWeight:600,color:C.sageDark}}>원하는 식물을 검색하세요</div></div>
      )}
    </div>
  );
};

/* ── 정원 카드 (접기/펼치기) ── */
const GardenCard=({plant,onAskDelete,onWatered,onChangeInterval,onUpdatePlant,defaultOpen=false})=>{
  const[open,setOpen]=useState(defaultOpen);
  const[catOpen,setCatOpen]=useState(false);
  const d=getDaysUntilWatering(plant);
  const over=d<0,today=d===0;
  const wc=over?C.terra:today?C.gold:C.sageDark;
  const wt=over?`${Math.abs(d)}일 초과!`:today?"오늘":d===1?"내일":`${d}일 후`;
  const dot=over?"🔴":today?"🟡":"🟢";

  // 현재 분류
  const curCat=classifyPlant(plant);
  const catInfo=PLANT_CATS[curCat]||PLANT_CATS.other;
  const isOverridden=!!(plant.plantCategory&&plant.categoryOverride);

  const changeCategory=(catKey)=>{
    onUpdatePlant(plant.koreanName,{plantCategory:catKey,categoryOverride:true});
    setCatOpen(false);
  };
  const resetCategory=()=>{
    onUpdatePlant(plant.koreanName,{plantCategory:undefined,categoryOverride:false});
    setCatOpen(false);
  };

  return(
    <div style={{background:"#fff",borderRadius:10,border:`1px solid ${over?C.terra+"60":today?C.gold+"60":C.sageLight}`,overflow:"hidden"}}>
      {/* 접힌 상태 */}
      <div onClick={()=>setOpen(v=>!v)}
        style={{display:"flex",alignItems:"center",padding:"10px 12px",cursor:"pointer",gap:8}}>
        <span style={{fontSize:13}}>{dot}</span>
        <div style={{flex:1,minWidth:0}}>
          <span style={{fontWeight:700,color:C.ink,fontSize:15}}>{plant.koreanName}</span>
          {isOverridden&&<span style={{fontSize:10,color:catInfo.color,marginLeft:4,fontWeight:700}}>*</span>}
          {plant.scientificName&&<span style={{fontSize:11,color:C.inkLight,fontStyle:"italic",marginLeft:6}}>{plant.scientificName}</span>}
        </div>
        <span style={{fontSize:12,color:wc,fontWeight:700,whiteSpace:"nowrap"}}>{wt}</span>
        <span style={{fontSize:12,color:C.inkLight,marginLeft:4}}>{open?"▲":"▼"}</span>
      </div>

      {/* 펼친 상태 */}
      {open&&(
        <div style={{borderTop:`1px solid ${C.sageLight}30`,background:C.cream,padding:"12px 14px"}}>
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
            {plant.lifespan&&<Badge color={C.terra}>{plant.lifespan}</Badge>}
            {plant.bloomSeason&&plant.bloomSeason!=="-"&&<Badge color={C.sage}>🌸 {plant.bloomSeason}</Badge>}
            {plant.difficulty&&<Badge color={C.gold}>난이도: {plant.difficulty}</Badge>}
            {plant.sunlight&&<Badge color={C.sky}>{plant.sunlight}</Badge>}
            {plant.propagation?.shockLevel&&plant.propagation.shockLevel!=="없음"&&<ShockBadge level={plant.propagation.shockLevel}/>}

            {/* 분류 뱃지 — 탭하면 변경 */}
            <button onClick={e=>{e.stopPropagation();setCatOpen(v=>!v);}}
              style={{display:"inline-flex",alignItems:"center",gap:3,padding:"2px 8px",borderRadius:20,
                border:`1.5px solid ${catInfo.color}`,background:catOpen?catInfo.color:catInfo.color+"18",
                color:catOpen?"#fff":catInfo.color,cursor:"pointer",fontSize:11,fontWeight:700}}>
              {catInfo.icon} {catInfo.label}{isOverridden&&<span style={{fontSize:10,opacity:0.8}}>*</span>}
              <span style={{fontSize:9,opacity:0.7,marginLeft:1}}>▼</span>
            </button>
          </div>

          {/* 분류 변경 피커 */}
          {catOpen&&(
            <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.sageLight}`,padding:"10px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
              <div style={{fontSize:11,color:C.inkLight,marginBottom:8,fontWeight:600}}>
                📂 분류 변경 <span style={{fontWeight:400}}>(나주 기후·재배 방식에 맞게)</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,marginBottom:8}}>
                {Object.entries(PLANT_CATS).map(([key,info])=>{
                  const isActive=curCat===key;
                  return(
                    <button key={key} onClick={()=>changeCategory(key)}
                      style={{padding:"6px 4px",borderRadius:8,border:`1.5px solid ${isActive?info.color:C.sageLight}`,
                        background:isActive?info.color:C.cream,color:isActive?"#fff":C.ink,
                        cursor:"pointer",fontSize:11,fontWeight:isActive?700:400,textAlign:"center",lineHeight:1.4}}>
                      <div style={{fontSize:14}}>{info.icon}</div>
                      <div>{info.label}</div>
                    </button>
                  );
                })}
              </div>
              {isOverridden&&(
                <button onClick={resetCategory}
                  style={{width:"100%",padding:"6px 0",background:"#fff",border:`1px solid ${C.sageLight}`,borderRadius:7,fontSize:11,color:C.inkLight,cursor:"pointer"}}>
                  ↩ 자동 분류로 되돌리기 (* 표시 제거)
                </button>
              )}
            </div>
          )}

          {plant.careNotes&&<div style={{fontSize:12,color:C.inkLight,background:C.goldLight+"60",borderRadius:7,padding:"6px 10px",borderLeft:`2px solid ${C.gold}`,marginBottom:10}}>{plant.careNotes}</div>}
          {/* 물주기 */}
          <div style={{background:wc+"15",borderRadius:8,padding:"8px 10px",border:`1px solid ${wc}30`,marginBottom:10}}>
            <div style={{fontSize:12,fontWeight:700,color:wc,marginBottom:6}}>💧 물주기 간격 설정</div>
            <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:6}}>
              {[1,2,3,5,7,10,14].map(dd=>(
                <button key={dd} onClick={()=>onChangeInterval(plant.koreanName,dd)}
                  style={{padding:"3px 8px",fontSize:12,borderRadius:6,border:`1px solid ${plant.wateringDays===dd?C.sky:C.sageLight}`,background:plant.wateringDays===dd?C.sky:"#fff",color:plant.wateringDays===dd?"#fff":C.inkLight,cursor:"pointer",fontWeight:plant.wateringDays===dd?700:400}}>{dd}일</button>
              ))}
            </div>
            {plant.lastWatered&&<div style={{fontSize:11,color:C.inkLight}}>마지막 물주기: {plant.lastWatered}</div>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>onWatered(plant.koreanName)}
              style={{flex:1,padding:"8px 0",background:C.sky,color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>💧 물 줬어요</button>
            <button onClick={()=>onAskDelete(plant.koreanName,`"${plant.koreanName}"을(를) 내 정원에서 삭제하시겠습니까?`,"식물 삭제")}
              style={{padding:"8px 14px",background:"#fff",color:C.terra,border:`1px solid ${C.terra}40`,borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>삭제</button>
          </div>
        </div>
      )}
    </div>
  );
};

const PLANT_CATS={
  fruit:     {label:"과수",        icon:"🍎", color:"#C0392B"},
  flowerTree:{label:"화목류",      icon:"🌸", color:"#8E44AD"},
  bulb:      {label:"구근류",      icon:"🧅", color:"#E67E22"},
  perennial: {label:"숙근초",      icon:"🌼", color:"#27AE60"},
  annual:    {label:"일·이년생",   icon:"🌺", color:"#E91E63"},
  vegetable: {label:"채소·과채",   icon:"🥬", color:"#2ECC71"},
  herb:      {label:"허브",        icon:"🌿", color:"#1ABC9C"},
  succulent: {label:"다육·선인장", icon:"🌵", color:"#7F8C8D"},
  woody:     {label:"수목·관엽",   icon:"🌳", color:"#4A6741"},
};

function classifyPlant(p){
  // ① AI가 plantCategory 반환했으면 그대로 (구버전 foliage/tree/other → woody 호환)
  if(p.plantCategory){
    const c=p.plantCategory;
    if(c==="foliage"||c==="tree"||c==="other") return "woody";
    if(PLANT_CATS[c]) return c;
  }

  const n   = p.koreanName||"";
  const ls  = (p.lifespan||"").toLowerCase();
  const prop= (p.propagation?.recommended||"").toLowerCase();

  // 이름에 "나무" 포함 여부 — 채소 오탐("무","파" 등) 방지
  const isWoody = n.includes("나무")||n.includes("나뭇");

  // ② 구근 — lifespan 또는 propagation 우선
  if(ls.includes("구근")||prop==="구근") return "bulb";

  // ③ 과수 — 채소보다 반드시 먼저 확인 (핵심 수정)
  const FRUITS=["무화과","사과나무","사과","배나무","복숭아나무","복숭아","자두나무","자두",
    "매실나무","매실","살구나무","살구","감나무","밤나무","호두나무","호두","블루베리",
    "라즈베리","블랙베리","석류나무","석류","귤나무","귤","레몬나무","레몬","라임나무","라임",
    "체리나무","체리","앵두나무","앵두","키위","올리브","아보카도","바나나","파파야","망고",
    "포도나무","포도","복분자","구아바","패션후르츠","산딸기"];
  if(FRUITS.some(f=>n.includes(f))) return "fruit";

  // ④ 허브
  const HERBS=["로즈마리","바질","민트","타임","세이지","파슬리","오레가노","라벤더","캐모마일",
    "딜","차이브","레몬밤","고수","루꼴라","쑥갓","스테비아","레몬버베나","펜넬","박하"];
  if(HERBS.some(h=>n.includes(h))) return "herb";

  // ⑤ 다육·선인장
  const SUCC=["선인장","다육","에케베리아","알로에","하월시아","세덤","칼랑코에","아가베","용설란","게발"];
  if(SUCC.some(s=>n.includes(s))) return "succulent";

  // ⑥ 관엽
  const FOL=["몬스테라","고무나무","스파티필룸","드라세나","산세비에리아","필로덴드론","칼라데아",
    "아글라오네마","싱고니움","베고니아","디펜바키아","포토스","아이비","틸란드시아","난초","호야"];
  if(FOL.some(f=>n.includes(f))) return "woody";

  // ⑦ 채소·과채 — isWoody(나무류) 절대 제외
  if(!isWoody){
    // 이름 전체 또는 앞부분이 정확히 일치해야 하는 단음절·이음절 이름
    const EXACT_VEG=["무","파","콩","깻잎","쑥","마","배추","상추"];
    if(EXACT_VEG.some(v=>n===v||n.startsWith(v+"(")||n.startsWith(v+" "))) return "vegetable";
    const VEGS=["고추","토마토","오이","당근","호박","가지","마늘","양파","감자","고구마",
      "딸기","수박","참외","완두","브로콜리","시금치","케일","청경채","셀러리","아티초크",
      "방울토마토","피망","파프리카","옥수수","비트","컬리플라워","쪽파","대파","부추","미나리",
      "로메인","생강","루꼴라","적채","쌈채소","바질(식용)","고구마순"];
    if(VEGS.some(v=>n.includes(v))) return "vegetable";
  }

  // ⑧ 화목류 — 꽃이 주목적인 목본 (배롱나무 포함)
  const FTREE=["장미","수국","목련","라일락","미스김","진달래","철쭉","모란","목단","치자",
    "금목서","은목서","동백","협죽도","화살나무","영산홍","히어리","매화나무","매화","벚나무",
    "벚꽃","산수유","목향장미","배롱나무","무궁화","수수꽃다리","병꽃나무","황매화","조팝나무",
    "홍가시","남천","피라칸타","팽나무","능소화","클레마티스"];
  if(FTREE.some(f=>n.includes(f))) return "flowerTree";

  // ⑨ 수목·교목 — 관상·녹음·식용 목본 (엄나무 포함)
  const TREES=["엄나무","소나무","향나무","측백","주목","메타세콰이어","느티","은행나무","왕벚",
    "목백합","참나무","단풍나무","계수나무","이팝나무","낙우송","잣나무","편백","소귀나무"];
  if(TREES.some(t=>n.includes(t))) return "woody";
  if(n.endsWith("나무")) return "woody"; // 위 목록에 없는 미분류 나무류

  // ⑩ 일·이년생 초화
  if(ls.includes("일년")||ls.includes("이년")) return "annual";

  // ⑪ 숙근초 (다년생 초화)
  if(ls.includes("다년")||ls.includes("숙근")) return "perennial";

  return "woody"; // 미분류는 수목·관엽으로
}

          <div key={s.key} style={{textAlign:"center",padding:"10px 4px",background:"#fff"}}>

                {catMap[openCat].map(p=>(

              <PlantDetail borderColor={PLANT_CATS[openCat].color}/>

        const wGroups={};
        have.forEach(p=>{const d=p.wateringDays||3;if(!wGroups[d])wGroups[d]=[];wGroups[d].push(p);});
        const wKeys=Object.keys(wGroups).map(Number).sort((a,b)=>a-b);
        const wLabel=d=>d===1?"매일":d===2?"이틀마다":d===3?"3일마다":d===5?"5일마다":d===7?"주 1회":d===14?"2주마다":`${d}일마다`;
        return(
          <div style={{padding:"10px 10px 8px"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,marginBottom:6}}>
              {wKeys.map(d=>{

                const isOpen=openCat==="w"+d;
                return(
                  <button key={d} onClick={()=>toggleCat("w"+d)}

                    <div style={{fontSize:10,color:isOpen?"rgba(255,255,255,0.9)":C.inkLight,marginTop:2}}>{wLabel(d)}</div>
                  </button>
                );
              })}
            </div>
            {openCat&&openCat.startsWith("w")&&(()=>{
              const d=Number(openCat.slice(1));
              const items=wGroups[d]||[];
              return items.length>0?(
                <div style={{background:C.sky+"10",borderRadius:10,padding:"10px 11px",
                  border:`1px solid ${C.sky}40`,marginBottom:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7}}>

                  </div>
                  <PlantDetail borderColor={C.sky}/>
                </div>
              ):null;
            })()}
          </div>
        );
      })()}
    </div>

                </div>
              </div>
            </div>
          )}
        </div>
      ):(()=>{
        const wc_=weather.kmaIcon?{label:weather.kmaLabel||"",icon:weather.kmaIcon}:weather.owmCode?(OWM_CODES[weather.owmCode]||{label:"알 수 없음",icon:"🌡️"}):(WEATHER_CODES[weather.weathercode]||{label:"알 수 없음",icon:"🌡️"});

        return(
          <div style={{background:`linear-gradient(135deg,${C.sky}18,${C.skyLight})`,borderRadius:14,marginBottom:12,border:`1px solid ${C.sky}35`,overflow:"hidden"}}>
            <div style={{padding:"8px 12px"}}>
              {/* 컴팩트 레이아웃: 한 줄에 모두 */}
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                {/* 아이콘 + 온도 */}
                <span style={{fontSize:32,flexShrink:0}}>{wc_.icon}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                    <span style={{fontSize:26,fontWeight:900,color:C.ink}}>{weather.temperature}°</span>
                    <span style={{fontSize:11,color:C.inkLight}}>체감 {weather.feelsLike}°</span>
                    <span style={{fontSize:11,color:C.inkLight}}>{wc_.label}</span>
                  </div>
                  <div style={{fontSize:10,color:C.sky,fontWeight:700,marginTop:-2}}>

                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:1}}>
                    <span style={{color:C.inkLight,fontWeight:400}}>{(()=>{const n=new Date();return n.getMonth()+1+"월 "+n.getDate()+"일 "+["일","월","화","수","목","금","토"][n.getDay()]+"요일";})()}</span>
                    <span style={{color:C.inkLight,fontWeight:400,opacity:0.7}}>{weather.updatedAt}</span>
                  </div>
                </div>
                </div>
                {/* 오른쪽: 최저/최고 + 갱신 */}
                <div style={{flexShrink:0,textAlign:"right"}}>
                  <div style={{display:"flex",gap:8,marginBottom:3,justifyContent:"flex-end"}}>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:9,color:C.inkLight}}>오늘</div>
                      <div style={{fontSize:11,fontWeight:700}}><span style={{color:C.terra}}>↑{weather.todayMax!=null?weather.todayMax+"°":"--"}</span> <span style={{color:C.sky}}>↓{weather.todayMin!=null?weather.todayMin+"°":"--"}</span></div>
                    </div>
                    {weather.tmrMax!=null&&<div style={{textAlign:"center"}}>
                      <div style={{fontSize:9,color:C.inkLight}}>내일</div>
                      <div style={{fontSize:11,fontWeight:700}}><span style={{color:C.terra}}>↑{weather.tmrMax+"°"}</span> <span style={{color:C.sky}}>↓{weather.tmrMin+"°"}</span></div>
                    </div>}
                  </div>
                  <div style={{display:"flex",gap:6,justifyContent:"flex-end",alignItems:"center"}}>
                    <span style={{fontSize:10,color:C.inkLight}}>💧{weather.humidity}% 🌧{weather.precipitation}mm 💨{weather.wind}km</span>
                    <button onClick={onRefresh} style={{background:"none",border:"1px solid "+C.sky,borderRadius:5,padding:"1px 5px",fontSize:10,color:C.sky,cursor:"pointer"}}>↻</button>
                  </div>
                </div>
              </div>
              {advice&&<div style={{padding:"5px 8px",background:advice.color+"18",borderRadius:7,border:"1px solid "+advice.color+"35",fontSize:12,color:advice.color,fontWeight:600}}>{advice.icon} {advice.text}</div>}
            </div>
            {weather.hourly?.length>0&&(
              <div style={{borderTop:`1px solid ${C.sky}25`,background:"rgba(255,255,255,0.5)"}}>
                <div style={{fontSize:11,color:C.inkLight,fontWeight:700,padding:"6px 14px 4px"}}>오늘 시간별 예보 (3시간 단위)</div>
                <div style={{display:"flex",overflowX:"auto",padding:"4px 10px 10px",gap:6,WebkitOverflowScrolling:"touch"}}>
                  {(()=>{const ci=weather.hourly.findIndex(s=>s.isCurrent);return ci>0?weather.hourly.slice(ci-1):weather.hourly;})().map(slot=>{
                    const sc=slot.kmaIcon?{icon:slot.kmaIcon}:slot.owmCode?(OWM_CODES[slot.owmCode]||{icon:"🌡️"}):(WEATHER_CODES[slot.weathercode]||{icon:"🌡️"});
                    return(
                      <div key={slot.hour} style={{flexShrink:0,width:46,borderRadius:8,padding:"5px 3px",textAlign:"center",background:slot.isCurrent?"rgba(74,144,196,0.2)":"rgba(255,255,255,0.65)",border:"1px solid "+(slot.isCurrent?C.sky+"70":"transparent"),opacity:slot.isPast?0.35:1}}>
                        <div style={{fontSize:9,color:slot.isCurrent?C.sky:C.inkLight,fontWeight:slot.isCurrent?700:400,marginBottom:2,lineHeight:1.2}}>{slot.isCurrent?"지금":slot.label}</div>
                        <div style={{fontSize:18,marginBottom:1,lineHeight:1}}>{sc.icon}</div>
                        <div style={{fontSize:14,fontWeight:700,color:C.ink,lineHeight:1.2}}>{slot.temp}°</div>
                        {slot.precipProb>0?<div style={{fontSize:9,color:C.sky,marginTop:2,fontWeight:600}}>💧{slot.precipProb}%</div>:<div style={{fontSize:9,color:"transparent"}}>-</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {/* ── 7일 일별 예보 가로스크롤 ── */}
            {daily.length>0&&(
              <div style={{borderTop:"1px solid "+C.sky+"20",padding:"6px 6px 8px"}}>
                <div style={{fontSize:11,color:C.inkLight,fontWeight:700,marginBottom:4,paddingLeft:4}}>📅 7일 예보 <span style={{fontWeight:400,fontSize:10}}>(탭하면 3시간 단위 확인)</span></div>
                <div style={{display:"flex",overflowX:"auto",gap:5,paddingBottom:4,WebkitOverflowScrolling:"touch"}}>
                  {daily.map((d,i)=>{
                    const wc=WEATHER_CODES[d.wcode]||{icon:"🌡️"};
                    const dt=new Date(d.date);
                    const dayNames=["일","월","화","수","목","금","토"];
                    const isToday=i===0,isTmr=i===1;
                    const label=isToday?"오늘":isTmr?"내일":dayNames[dt.getDay()];
                    const isSun=dt.getDay()===0,isSat=dt.getDay()===6;
                    const isExp=expDay===d.date;
                    return(
                      <div key={d.date} onClick={()=>setExpDay(isExp?null:d.date)}
                        style={{flexShrink:0,width:48,borderRadius:7,padding:"3px 2px",textAlign:"center",cursor:"pointer",

                          border:"1px solid "+(isExp?C.sky+"90":isToday?C.sky+"40":"transparent"),
                          transition:"all 0.15s"}}>
                        <div style={{fontSize:10,fontWeight:isToday||isTmr?700:400,marginBottom:0,lineHeight:1.2,
                          color:isExp?C.sky:isToday?C.sky:isSun?C.rose:isSat?"#5B9BD5":C.inkLight}}>
                          {label}
                        </div>
                        {i>0&&<div style={{fontSize:9,color:C.inkLight,marginBottom:0}}>{(dt.getMonth()+1)+"/"+(dt.getDate())}</div>}
                        <div style={{fontSize:15,lineHeight:1,marginBottom:1}}>{wc.icon}</div>
                        <div style={{fontSize:11,fontWeight:700,lineHeight:1.4}}>
                          <span style={{color:C.terra}}>{d.max}</span><span style={{color:C.inkLight,fontSize:9,margin:"0 2px"}}>/</span><span style={{color:"#5B9BD5"}}>{d.min}</span>
                        </div>
                        {d.precipProb>0?<div style={{fontSize:9,color:C.sky,marginTop:2}}>💧{d.precipProb}%</div>:<div style={{fontSize:9,color:"transparent"}}>-</div>}
                      </div>
                    );
                  })}
                </div>
                {/* 클릭한 날 3시간 예보 펼침 */}
                {expDay&&(()=>{
                  const sel=daily.find(d=>d.date===expDay);
                  if(!sel||!sel.hourly||sel.hourly.length===0) return(
                    <div style={{padding:"8px",textAlign:"center",fontSize:12,color:C.inkLight}}>시간별 데이터 없음</div>
                  );
                  const dt=new Date(expDay);
                  const dayNames=["일","월","화","수","목","금","토"];
                  const isToday=daily[0]?.date===expDay;
                  const label=isToday?"오늘":daily[1]?.date===expDay?"내일":`${dt.getMonth()+1}/${dt.getDate()} (${dayNames[dt.getDay()]})`;
                  return(
                    <div style={{background:"rgba(255,255,255,0.7)",borderRadius:10,padding:"8px 6px",border:"1px solid "+C.sky+"30",marginTop:4}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.sky,marginBottom:6,paddingLeft:2}}>{label} 3시간별 예보</div>
                      <div style={{display:"flex",overflowX:"auto",gap:5,WebkitOverflowScrolling:"touch"}}>
                        {sel.hourly.map(h=>(
                          <div key={h.hour} style={{flexShrink:0,width:46,borderRadius:8,padding:"5px 3px",textAlign:"center",background:"rgba(255,255,255,0.8)",border:"1px solid "+C.sageLight+"60"}}>
                            <div style={{fontSize:9,color:C.inkLight,marginBottom:2,lineHeight:1.2}}>{h.label}</div>
                            <div style={{fontSize:18,lineHeight:1,marginBottom:2}}>{h.icon}</div>
                            <div style={{fontSize:14,fontWeight:700,color:C.ink,lineHeight:1.2}}>{h.temp}°</div>
                            {h.precipProb>0?<div style={{fontSize:9,color:C.sky,marginTop:2}}>💧{h.precipProb}%</div>:<div style={{fontSize:9,color:"transparent"}}>-</div>}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
            <div style={{padding:"3px 14px 6px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:10,color:C.inkLight}}>{weather.source==="KMA"?"🇰🇷 기상청 (공식)":weather.source==="OWM"?"🌍 OpenWeatherMap":"📡 Open-Meteo (기본)"}</span>
              <button onClick={()=>setShowOwmInput(v=>!v)} style={{fontSize:10,color:weather.source==="KMA"?C.teal:weather.source==="OWM"?C.sky:C.terra,background:"none",border:`1px solid ${weather.source==="KMA"?C.teal:weather.source==="OWM"?C.sky:C.terra}`,borderRadius:6,padding:"2px 7px",cursor:"pointer"}}>{weather.source==="KMA"?"✅ 기상청":weather.source==="OWM"?"✅ OWM":"⚙️ 설정"}</button>
            </div>
            {showOwmInput&&(
              <div style={{padding:"8px 14px 12px",background:"rgba(255,255,255,0.7)",borderTop:`1px solid ${C.sky}20`}}>
                <div style={{marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><span>🇰🇷</span><span style={{fontSize:12,color:C.ink,fontWeight:700}}>기상청 단기예보 API</span>{loadStorage("kma_api_key","")&&<span style={{fontSize:10,background:C.teal,color:"#fff",borderRadius:10,padding:"1px 7px"}}>연결됨</span>}</div>
                  <div style={{fontSize:11,color:C.inkLight,marginBottom:8,lineHeight:1.7,background:C.goldLight+"50",borderRadius:7,padding:"6px 8px"}}>1. <a href="https://www.data.go.kr" target="_blank" style={{color:C.sky}}>data.go.kr</a> 회원가입<br/>2. "기상청_단기예보 조회서비스" 검색 → 활용신청<br/>3. 마이페이지 → 개발계정 → 일반 인증키(Encoding) 복사<br/><span style={{color:C.terra}}>⚠️ 발급 후 최대 1시간 후 활성화</span></div>
                  <div style={{display:"flex",gap:8}}><input id="kmaKeyInput" defaultValue={loadStorage("kma_api_key","")} placeholder="기상청 일반 인증키(Encoding)" style={{flex:1,padding:"7px 10px",border:`1px solid ${C.teal}`,borderRadius:8,fontSize:11,outline:"none"}}/><button onClick={()=>{const v=document.getElementById("kmaKeyInput")?.value?.trim();saveStorage("kma_api_key",v||"");setShowOwmInput(false);onRefresh();}} style={{padding:"7px 12px",background:C.teal,color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:12,cursor:"pointer"}}>저장</button>{loadStorage("kma_api_key","")&&<button onClick={()=>{saveStorage("kma_api_key","");setShowOwmInput(false);onRefresh();}} style={{padding:"7px 10px",background:"#fff",color:C.terra,border:`1px solid ${C.terra}`,borderRadius:8,fontSize:11,cursor:"pointer"}}>삭제</button>}</div>
                </div>
                <div style={{borderTop:`1px solid ${C.sageLight}`,paddingTop:10}}>
                  <div style={{fontSize:12,color:C.ink,fontWeight:700,marginBottom:6}}>🌍 OpenWeatherMap (대안)</div>
                  <div style={{display:"flex",gap:8}}><input id="owmKeyInput" defaultValue={loadStorage("owm_api_key","")} placeholder="openweathermap.org API 키" style={{flex:1,padding:"7px 10px",border:`1px solid ${C.sky}`,borderRadius:8,fontSize:12,outline:"none"}}/><button onClick={()=>{const v=document.getElementById("owmKeyInput")?.value?.trim();saveStorage("owm_api_key",v||"");setShowOwmInput(false);onRefresh();}} style={{padding:"7px 12px",background:C.sky,color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:12,cursor:"pointer"}}>저장</button>{loadStorage("owm_api_key","")&&<button onClick={()=>{saveStorage("owm_api_key","");setShowOwmInput(false);onRefresh();}} style={{padding:"7px 10px",background:"#fff",color:C.terra,border:`1px solid ${C.terra}`,borderRadius:8,fontSize:11,cursor:"pointer"}}>삭제</button>}</div>
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* ── 내 정원 요약 ── */}
      <GardenStats have={have} challenge={challenge} garden={garden} onWatered={onWatered} onChangeInterval={onChangeInterval} onAskDelete={onAskDelete} onUpdatePlant={onUpdatePlant}/>

      {/* ── 물주기 필요 배너 ── */}
      {overdueCount>0&&(
        <div style={{background:C.terra+"18",borderRadius:12,padding:"10px 14px",marginBottom:12,border:`1px solid ${C.terra}50`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,color:C.terra,fontSize:14}}>💧 물주기 필요 {overdueCount}종</div>
              <div style={{fontSize:11,color:C.inkLight,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{have.filter(p=>getDaysUntilWatering(p)<=0).map(p=>p.koreanName).join(", ")}</div>
            </div>
            <button onClick={()=>have.filter(p=>getDaysUntilWatering(p)<=0).forEach(p=>onWatered(p.koreanName))}
              style={{background:C.sky,color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap",marginLeft:10,flexShrink:0}}>
              💧 전체 물주기
            </button>
          </div>
        </div>
      )}

      {/* ── 현재 있는 식물 헤더 ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontWeight:800,color:C.moss,fontSize:16}}>🌱 현재 있는 식물 <span style={{fontSize:13,color:C.inkLight,fontWeight:400}}>({have.length}종)</span></div>
        <button onClick={goSearch} style={{padding:"5px 12px",background:C.sageDark,color:"#fff",border:"none",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>+ 추가</button>
      </div>

      {/* ── 물주기 주기별 그룹 (접기/펼치기) ── */}
      {have.length===0?(
        <div style={{textAlign:"center",padding:"30px 20px",color:C.inkLight,background:"#fff",borderRadius:12,marginBottom:16,border:`1px solid ${C.sageLight}`}}>
          <div style={{fontSize:44,marginBottom:8}}>🌿</div>
          <div style={{fontSize:14,color:C.sageDark}}>식물을 검색해서 추가해보세요</div>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
          {sortedKeys.map(days=>{
            const grpPlants=groups[days];
            const needWater=grpPlants.filter(p=>getDaysUntilWatering(p)<=0).length;
            const isOpen=openGroups[days]!==undefined ? openGroups[days] : needWater>0;
            return(
              <div key={days} style={{background:"#fff",borderRadius:12,border:`1px solid ${needWater>0?C.terra+"60":C.sageLight}`,overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.04)"}}>
                {/* 그룹 헤더 - 클릭으로 열기/닫기 */}
                <div onClick={()=>toggleGroup(days)}
                  style={{background:needWater>0?C.terra+"12":C.skyLight+"50",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16}}>💧</span>
                    <div>
                      <span style={{fontWeight:700,color:needWater>0?C.terra:C.sky,fontSize:14}}>{groupLabel(days)}</span>
                      <span style={{fontWeight:400,color:C.inkLight,fontSize:11,marginLeft:6}}>
                        {grpPlants.length}종{needWater>0?<span style={{color:C.terra}}> · {needWater}종 물주기 필요</span>:""}
                      </span>
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <button
                      onClick={e=>{e.stopPropagation();grpPlants.forEach(p=>onWatered(p.koreanName));}}
                      style={{background:C.sky,color:"#fff",border:"none",borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                      전체 물주기
                    </button>
                    <span style={{fontSize:14,color:C.inkLight,transition:"transform 0.2s",display:"inline-block",transform:isOpen?"rotate(180deg)":"rotate(0deg)"}}>▼</span>
                  </div>
                </div>
                {/* 식물 목록 - 접기/펼치기 */}
                {isOpen&&(
                  <div>
                    {grpPlants.map((p,i)=>(
                      <div key={p.koreanName} style={{borderTop:i>0?`1px solid ${C.sageLight}25`:"none"}}>
                        <GardenCard plant={p} onAskDelete={onAskDelete} onWatered={onWatered} onChangeInterval={onChangeInterval} onUpdatePlant={onUpdatePlant}/>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div style={{background:`linear-gradient(135deg,${C.rose}12,#FFE8F0)`,borderRadius:14,border:`2px dashed ${C.rose}50`,padding:"12px 14px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showInput||challenge.length>0?10:0}}>
          <div style={{fontWeight:800,color:C.rose,fontSize:15}}>🌸 위시 가든 <span style={{fontSize:12,color:C.inkLight,fontWeight:400}}>({challenge.length}종)</span></div>

const FertTab=({fertilizers,onAdd,onAskDelete,apiKey})=>{

  const[result,setResult]=useState(null);
  const[error,setError]=useState("");

  const[form,setForm]=useState({name:"",category:"organic",npk:"",form:"고형",usage:"기비",amount:"",timing:"",notes:"",effect:"",crops:"",caution:""});

  const filtered=filter==="전체"?fertilizers:fertilizers.filter(f=>f.category===filter);

  // AI 검색 실행
  const runSearch=async(q)=>{
    if(loading) return;  // 연타 방지

      const r=await callGemini([{text:FERT_SEARCH_PROMPT(name)}],apiKey);
      setResult(r);
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  // 검색결과 → 보유 등록
  const registerHave=()=>{
    if(!result||result.found===false) return;
    const sr=result;
    onAdd({id:Date.now(),name:sr.name,category:sr.category||"compound",
      npk:sr.npk||"-",form:sr.form||"고형",usage:sr.usage||"추비",
      amount:sr.amount||"",timing:sr.timing||"",notes:sr.notes||"",
      effect:sr.effect||"",crops:Array.isArray(sr.crops)&&sr.crops.length?sr.crops:["전작물"],
      caution:sr.caution||"",status:"have"});

          {/* ── 직접 입력 (접기/펼치기) ── */}
          {!result&&(

                  ].map(([label,el])=><div key={label} style={{marginBottom:9}}><STitle>{label}</STitle>{el}</div>)}
                  <button onClick={submitManual}
                    style={{width:"100%",padding:10,background:C.moss,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:14,cursor:"pointer",marginTop:4}}>

                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* 비료 목록 */}
      {filtered.length===0
        ?<div style={{textAlign:"center",padding:"40px 20px",color:C.inkLight}}><div style={{fontSize:44,marginBottom:8}}>🌿</div><div style={{fontWeight:600,color:C.sageDark}}>비료가 없습니다</div></div>
        :<div style={{display:"flex",flexDirection:"column",gap:10}}>{filtered.map(item=><FertCard key={item.id} item={item} onAskDelete={onAskDelete}/>)}</div>}

};
