const DiagPanel=({pesticides,fertilizers,apiKey,onAddPest,onAddFert})=>{
  const[imgFile,setImgFile]=useState(null);
  const[imgPreview,setImgPreview]=useState(null);
  const[result,setResult]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[userDesc,setUserDesc]=useState("");
  const fileRef2=useRef(null);
  const camRef2=useRef(null);
  // 농약 검색 상태 {name, loading, result, error, registered}
  const[pestSearch,setPestSearch]=useState({});
  // 비료 검색 상태 {name, loading, result, error, registered}
  const[fertSearch,setFertSearch]=useState({});
  // 구매예정 등록 추적
  const[pestPlanned,setPestPlanned]=useState({});
  const[fertPlanned,setFertPlanned]=useState({});

  const sel=e=>{const f=e.target.files?.[0];if(!f)return;setImgFile(f);setImgPreview(URL.createObjectURL(f));setResult(null);setError("");};
  const reset=()=>{setImgPreview(null);setImgFile(null);setResult(null);setError("");setPestSearch({});setFertSearch({});setPestPlanned({});setFertPlanned({});};

  // 구매예정 등록 - 농약
  const addPestPlanned=(rawName,isEco)=>{
    const name=rawName.replace(/\s*\(.*?\)\s*/g,"").trim();
    if(pestPlanned[name]) return;
    onAddPest({id:Date.now(),name,type:"insecticide",ecoClass:isEco?"eco":"chemical",
      status:"planned",activeIngredient:"",dilution:"",interval:7,preharvest:0,
      target:[],crops:["전작물"],notes:"AI 진단 추천",caution:""});
    setPestPlanned(prev=>({...prev,[name]:true}));
  };

  // 구매예정 등록 - 비료
  const addFertPlanned=(name)=>{
    if(fertPlanned[name]) return;
    onAddFert({id:Date.now(),name,category:"compound",npk:"-",form:"고형",
      usage:"추비",amount:"",timing:"",notes:"AI 진단 추천",effect:"",
      crops:["전작물"],caution:"",status:"planned"});
    setFertPlanned(prev=>({...prev,[name]:true}));
  };

  const diag=async()=>{
    if(loading) return;  // 연타 방지
    if(!imgFile&&!userDesc.trim()){setError("사진 또는 피해 내용을 입력해주세요.");return;}
    setLoading(true);setError("");setPestSearch({});setFertSearch({});
    try{
      const parts=[];
      if(imgFile){const b=await fileToBase64(imgFile);parts.push({inlineData:{mimeType:imgFile.type||"image/jpeg",data:b}});}
      parts.push({text:DIAGNOSIS_PROMPT(pesticides,fertilizers,userDesc)});
      const r=await callGemini(parts,apiKey);
      setResult(r);
    }catch(e){setError("진단 오류: "+e.message);}
    finally{setLoading(false);}
  };

  // 농약 상세 검색
  const searchPest=async(rawName)=>{
    // 희석배율 등 괄호 내용 제거하여 순수 제품명만 추출
    const name=rawName.replace(/\s*\(.*?\)\s*/g,"").trim();
    if(pestSearch[name]?.loading) return;
    setPestSearch(prev=>({...prev,[name]:{loading:true,result:null,error:null,open:true,registered:false}}));
    try{
      const r=await callGemini([{text:PEST_SEARCH_PROMPT(name)}],apiKey);
      setPestSearch(prev=>({...prev,[name]:{...prev[name],loading:false,result:r}}));
    }catch(e){
      setPestSearch(prev=>({...prev,[name]:{...prev[name],loading:false,error:e.message}}));
    }
  };

  // 비료 상세 검색
  const searchFert=async(rawName)=>{
    const name=rawName.trim();
    if(fertSearch[name]?.loading) return;
    setFertSearch(prev=>({...prev,[name]:{loading:true,result:null,error:null,open:true,registered:false}}));
    try{
      const r=await callGemini([{text:FERT_SEARCH_PROMPT(name)}],apiKey);
      setFertSearch(prev=>({...prev,[name]:{...prev[name],loading:false,result:r}}));
    }catch(e){
      setFertSearch(prev=>({...prev,[name]:{...prev[name],loading:false,error:e.message}}));
    }
  };

  // 농약 등록
  const registerPest=(sr,key)=>{
    if(!onAddPest||!sr?.found) return;
    const newP={
      id:Date.now(),name:sr.name,type:sr.type||"insecticide",ecoClass:sr.ecoClass||"chemical",
      activeIngredient:sr.activeIngredient||"",dilution:sr.dilution||"",
      interval:Number(sr.interval)||7,preharvest:Number(sr.preharvest)||3,
      target:Array.isArray(sr.target)?sr.target:[],
      crops:Array.isArray(sr.crops)&&sr.crops.length?sr.crops:["전작물"],
      notes:sr.notes||"",caution:sr.caution||""
    };
    onAddPest(newP);
    const k=key||sr.name;
    setPestSearch(prev=>({...prev,[k]:{...prev[k],registered:true}}));
  };

  // 비료 등록
  const registerFert=(sr,key)=>{
    if(!onAddFert||!sr?.found) return;
    const newF={
      id:Date.now(),name:sr.name,category:sr.category||"compound",npk:sr.npk||"-",
      form:sr.form||"고형",usage:sr.usage||"추비",amount:sr.amount||"",
      timing:sr.timing||"",notes:sr.notes||"",effect:sr.effect||"",
      crops:Array.isArray(sr.crops)&&sr.crops.length?sr.crops:["전작물"],
      caution:sr.caution||""
    };
    onAddFert(newF);
    const k=key||sr.name;
    setFertSearch(prev=>({...prev,[k]:{...prev[k],registered:true}}));
  };

  const SEV={경미:{bg:C.tealLight,color:C.teal,border:C.teal},보통:{bg:C.amberLight,color:C.amber,border:C.amber},심각:{bg:C.roseLight,color:C.rose,border:C.rose}};
  const URG={즉시처리:{bg:C.rose,label:"🚨 즉시 처리"},"1~2일내":{bg:C.amber,label:"⚡ 1~2일 내"},관찰후결정:{bg:C.teal,label:"👁 관찰 후 결정"}};
  const TYPE_LABEL={insecticide:"살충",fungicide:"살균",acaricide:"살비",herbicide:"제초",other:"기타"};
  const FERT_CAT2={organic:{icon:"🌿",color:C.moss},nitrogen:{icon:"🟢",color:C.sageDark},phosphate:{icon:"🟠",color:C.terra},potassium:{icon:"🟣",color:C.purple},calcium:{icon:"⚪",color:C.sky},compound:{icon:"🌱",color:C.gold}};

  // 농약 검색 결과 렌더 함수
  const renderPestSearchResult=(name,sr)=>{
    if(!sr) return null;
    const isOpen=sr.open;
    return(
      <div style={{marginTop:4,marginBottom:6,borderRadius:10,border:`1.5px solid ${C.terra}50`,overflow:"hidden",background:"#fff"}}>
        <div onClick={()=>setPestSearch(prev=>({...prev,[name]:{...prev[name],open:!isOpen}}))}
          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",cursor:"pointer",background:C.roseLight+"80"}}>
          <span style={{fontSize:12,fontWeight:700,color:C.terra}}>🔍 {name} 검색 결과</span>
          <span style={{fontSize:11,color:C.inkLight}}>{isOpen?"▲":"▼"}</span>
        </div>
        {isOpen&&(
          <div style={{padding:"10px 12px"}}>
            {sr.loading&&<div style={{textAlign:"center",padding:"10px",fontSize:12,color:C.inkLight}}>⏳ AI 검색 중...</div>}
            {sr.error&&<div style={{fontSize:12,color:C.rose,background:C.roseLight,borderRadius:6,padding:"6px 9px"}}>{sr.error}</div>}
            {sr.result&&(sr.result.found===false?(
              <div style={{fontSize:12,color:C.amber,background:C.amberLight,borderRadius:6,padding:"6px 9px"}}>
                🤔 {sr.result.message||"정보를 찾지 못했습니다."}
              </div>
            ):(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <span style={{fontWeight:800,fontSize:14,color:C.ink}}>{sr.result.name}</span>
                  <span style={{fontSize:10,background:sr.result.ecoClass==="eco"?C.teal:C.inkLight,color:"#fff",borderRadius:8,padding:"1px 6px"}}>{sr.result.ecoClass==="eco"?"친환경":"화학"}</span>
                  <span style={{fontSize:10,background:C.terra+"20",color:C.terra,borderRadius:8,padding:"1px 6px"}}>{TYPE_LABEL[sr.result.type]||sr.result.type}</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:8}}>
                  {[["💊 유효성분",sr.result.activeIngredient],["📏 희석배율",sr.result.dilution],["⏱ 살포간격",sr.result.interval!=null?sr.result.interval+"일":null],["🌾 수확전",sr.result.preharvest!=null?sr.result.preharvest+"일":null]].map(([l,v])=>v?(
                    <div key={l} style={{background:C.cream,borderRadius:6,padding:"5px 8px",border:`1px solid ${C.sageLight}40`}}>
                      <div style={{fontSize:10,color:C.inkLight}}>{l}</div>
                      <div style={{fontSize:11,fontWeight:600,color:C.ink}}>{v}</div>
                    </div>
                  ):null)}
                </div>
                {sr.result.target?.length>0&&<div style={{marginBottom:6}}>
                  <div style={{fontSize:10,color:C.inkLight,marginBottom:3}}>🎯 방제 대상</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3}}>{sr.result.target.map(t=><span key={t} style={{fontSize:10,background:C.terra+"18",color:C.terra,borderRadius:8,padding:"2px 7px"}}>{t}</span>)}</div>
                </div>}
                {sr.result.crops?.length>0&&<div style={{marginBottom:6}}>
                  <div style={{fontSize:10,color:C.inkLight,marginBottom:2}}>🌾 적용 작물</div>
                  <div style={{fontSize:11,color:C.ink}}>{sr.result.crops.join(", ")}</div>
                </div>}
                {sr.result.notes&&<div style={{fontSize:11,color:C.inkLight,background:C.goldLight+"60",borderRadius:6,padding:"5px 8px",borderLeft:`2px solid ${C.gold}`,marginBottom:6}}>📝 {sr.result.notes}</div>}
                {sr.result.caution&&<div style={{fontSize:10,color:C.rose,background:C.roseLight,borderRadius:6,padding:"4px 8px",borderLeft:`2px solid ${C.rose}`,marginBottom:8}}>⚠️ {sr.result.caution}</div>}
                {/* 유사 농약 */}
                {sr.result.similar?.length>0&&(
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.inkLight,marginBottom:5}}>🔄 유사 농약</div>
                    {sr.result.similar.map((sim,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 8px",background:C.cream,borderRadius:6,marginBottom:4,border:`1px solid ${C.sageLight}`}}>
                        <span style={{fontSize:10,background:sim.ecoClass==="eco"?C.teal:C.inkLight,color:"#fff",borderRadius:6,padding:"1px 5px",flexShrink:0}}>{sim.ecoClass==="eco"?"친환경":"화학"}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:700,color:C.ink}}>{sim.name}</div>
                          <div style={{fontSize:10,color:C.inkLight}}>{sim.reason}</div>
                        </div>
                        <button onClick={()=>searchPest(sim.name)}
                          style={{fontSize:10,background:"#fff",border:`1px solid ${C.terra}`,color:C.terra,borderRadius:6,padding:"3px 7px",cursor:"pointer",flexShrink:0}}>
                          검색
                        </button>
                      </div>
                    ))}
                  </div>
                )}
                {/* 등록 버튼 */}
                <button onClick={()=>registerPest(sr.result,name)}
                  disabled={!!sr.registered}
                  style={{width:"100%",padding:"9px 0",background:sr.registered?"#B5CEAA":C.terra,color:"#fff",border:"none",borderRadius:9,fontWeight:700,fontSize:13,cursor:sr.registered?"default":"pointer"}}>
                  {sr.registered?"✅ 농약 목록에 등록됨":"➕ 농약 목록에 등록하기"}
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  // 비료 검색 결과 렌더 함수
  const renderFertSearchResult=(name,sr)=>{
    if(!sr) return null;
    const isOpen=sr.open;
    const cat=FERT_CAT2[sr.result?.category]||{icon:"🌱",color:C.gold};
    return(
      <div style={{marginTop:4,marginBottom:6,borderRadius:10,border:`1.5px solid ${C.sageDark}50`,overflow:"hidden",background:"#fff"}}>
        <div onClick={()=>setFertSearch(prev=>({...prev,[name]:{...prev[name],open:!isOpen}}))}
          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",cursor:"pointer",background:C.sageLight+"50"}}>
          <span style={{fontSize:12,fontWeight:700,color:C.sageDark}}>🔍 {name} 검색 결과</span>
          <span style={{fontSize:11,color:C.inkLight}}>{isOpen?"▲":"▼"}</span>
        </div>
        {isOpen&&(
          <div style={{padding:"10px 12px"}}>
            {sr.loading&&<div style={{textAlign:"center",padding:"10px",fontSize:12,color:C.inkLight}}>⏳ AI 검색 중...</div>}
            {sr.error&&<div style={{fontSize:12,color:C.rose,background:C.roseLight,borderRadius:6,padding:"6px 9px"}}>{sr.error}</div>}
            {sr.result&&(sr.result.found===false?(
              <div style={{fontSize:12,color:C.amber,background:C.amberLight,borderRadius:6,padding:"6px 9px"}}>
                🤔 {sr.result.message||"정보를 찾지 못했습니다."}
              </div>
            ):(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <span style={{fontSize:18}}>{cat.icon}</span>
                  <div>
                    <div style={{fontWeight:800,fontSize:14,color:C.ink}}>{sr.result.name}</div>
                    <div style={{fontSize:11,color:C.inkLight}}>{sr.result.npk} · {sr.result.form}</div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:8}}>
                  {[["🌱 용도",sr.result.usage],["📅 시비시기",sr.result.timing],["📏 시비량",sr.result.amount],["✨ 효과",sr.result.effect]].map(([l,v])=>v?(
                    <div key={l} style={{background:C.cream,borderRadius:6,padding:"5px 8px",border:`1px solid ${C.sageLight}40`,gridColumn:(l==="📏 시비량"||l==="✨ 효과")?"1/-1":"auto"}}>
                      <div style={{fontSize:10,color:C.inkLight}}>{l}</div>
                      <div style={{fontSize:11,fontWeight:600,color:C.ink}}>{v}</div>
                    </div>
                  ):null)}
                </div>
                {sr.result.notes&&<div style={{fontSize:11,color:C.inkLight,background:C.goldLight+"60",borderRadius:6,padding:"5px 8px",borderLeft:`2px solid ${C.gold}`,marginBottom:6}}>📝 {sr.result.notes}</div>}
                {sr.result.caution&&<div style={{fontSize:10,color:C.rose,background:C.roseLight,borderRadius:6,padding:"4px 8px",borderLeft:`2px solid ${C.rose}`,marginBottom:8}}>⚠️ {sr.result.caution}</div>}
                <button onClick={()=>registerFert(sr.result,name)}
                  disabled={!!sr.registered}
                  style={{width:"100%",padding:"9px 0",background:sr.registered?"#B5CEAA":C.sageDark,color:"#fff",border:"none",borderRadius:9,fontWeight:700,fontSize:13,cursor:sr.registered?"default":"pointer"}}>
                  {sr.registered?"✅ 비료 목록에 등록됨":"➕ 비료 목록에 등록하기"}
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  // 추천 농약 목록 렌더 함수 (컴포넌트가 아닌 일반 함수로 호출 → 클로저 완전 보장)
  const renderPestList=(items,isInventory,isEco)=>{
    if(!items?.length) return null;
    const color=isEco?C.teal:C.inkLight;
    const bg=isEco?C.tealLight:C.cream;
    const icon=isEco?"🌿":"🧪";
    return(
      <div style={{marginBottom:6}}>
        <div style={{fontSize:11,color,fontWeight:700,marginBottom:4}}>
          {isInventory?`✅ 보유 ${isEco?"친환경":"화학"} 농약`:`🛒 구매 권장 ${isEco?"친환경":"화학"} 농약`}
        </div>
        {items.map(p=>{
          const bracketMatch=p.match(/^(.+?)\s*(\([^)]+\))$/);
          const displayName=bracketMatch?bracketMatch[1].trim():p;
          const dilutionHint=bracketMatch?bracketMatch[2]:"";
          const sr=!isInventory?pestSearch[displayName]:null;
          return(
            <div key={p}>
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 8px",background:bg,borderRadius:6,marginBottom:3,border:`1px solid ${color}30`}}>
                <span style={{fontSize:13,flexShrink:0}}>{icon}</span>
                <div style={{flex:1,minWidth:0}}>
                  <span style={{fontSize:12,fontWeight:isInventory?600:400,color:isInventory?color:C.inkLight}}>{displayName}</span>
                  {dilutionHint&&<span style={{fontSize:10,color:C.inkLight,marginLeft:4}}>{dilutionHint}</span>}
                </div>
                {isInventory
                  ?<span style={{fontSize:10,background:color,color:"#fff",borderRadius:10,padding:"1px 6px",flexShrink:0}}>보유</span>
                  :<div style={{display:"flex",gap:4,flexShrink:0}}>
                    <button
                      onClick={()=>searchPest(displayName)}
                      disabled={!!(sr&&sr.loading)}
                      style={{fontSize:10,background:sr&&sr.loading?C.sageLight:sr&&sr.registered?"#4D7A52":C.terra,color:"#fff",border:"none",borderRadius:6,padding:"4px 7px",cursor:"pointer",whiteSpace:"nowrap",fontWeight:700}}>
                      {sr&&sr.loading?"검색중…":sr&&sr.registered?"✅ 등록됨":"🔍 검색·등록"}
                    </button>
                    <button
                      onClick={()=>addPestPlanned(displayName,isEco)}
                      style={{fontSize:10,background:pestPlanned[displayName.replace(/\s*\(.*?\)\s*/g,"").trim()]?C.sageLight:C.amber,color:"#fff",border:"none",borderRadius:6,padding:"4px 7px",cursor:"pointer",whiteSpace:"nowrap",fontWeight:700}}>
                      {pestPlanned[displayName.replace(/\s*\(.*?\)\s*/g,"").trim()]?"🛒 예정됨":"🛒 구매예정"}
                    </button>
                  </div>
                }
              </div>
              {!isInventory&&sr&&renderPestSearchResult(displayName,sr)}
            </div>
          );
        })}
      </div>
    );
  };

  return(
    <div style={{background:"#fff",borderRadius:16,border:`2px solid ${C.terra}40`,overflow:"hidden",marginBottom:16}}>
      {/* 헤더 */}
      <div style={{background:`linear-gradient(135deg,${C.rose},${C.terra})`,padding:"12px 16px",color:"#fff"}}>
        <div style={{fontWeight:900,fontSize:16}}>🔬 AI 작물 피해 진단</div>
        <div style={{fontSize:11,opacity:0.85,marginTop:2}}>사진 + 증상 설명 → 보유 농약 우선 추천 · 비보유 농약 검색 & 등록</div>
      </div>

      <div style={{padding:"12px 14px"}}>
        {/* 사진 영역 */}
        {imgPreview?(
          <div style={{position:"relative",marginBottom:10,borderRadius:10,overflow:"hidden"}}>
            <img src={imgPreview} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}}/>
            <button onClick={reset} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,0.55)",color:"#fff",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14}}>✕</button>
          </div>
        ):(
          <div style={{background:C.roseLight,borderRadius:10,padding:"16px 14px",marginBottom:10,border:`2px dashed ${C.terra}50`}}>
            <div style={{fontSize:13,color:C.terra,fontWeight:700,marginBottom:10,textAlign:"center"}}>📸 피해 부위 사진 (선택)</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>camRef2.current?.click()}
                style={{flex:1,padding:"10px 0",background:C.terra,color:"#fff",border:"none",borderRadius:9,fontWeight:700,fontSize:13,cursor:"pointer"}}>
                📸 카메라 촬영
              </button>
              <button onClick={()=>fileRef2.current?.click()}
                style={{flex:1,padding:"10px 0",background:"#fff",color:C.terra,border:`1.5px solid ${C.terra}`,borderRadius:9,fontWeight:700,fontSize:13,cursor:"pointer"}}>
                🖼️ 갤러리 선택
              </button>
            </div>
          </div>
        )}
        <input ref={camRef2} type="file" accept="image/*" capture="environment" onChange={sel} style={{display:"none"}}/>
        <input ref={fileRef2} type="file" accept="image/*" onChange={sel} style={{display:"none"}}/>

        {/* 피해 내용 텍스트 입력 */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:12,color:C.ink,fontWeight:700,marginBottom:5}}>📝 피해 증상 설명 <span style={{fontWeight:400,color:C.inkLight}}>(작물명·증상 직접 입력)</span></div>
          <textarea
            value={userDesc}
            onChange={e=>setUserDesc(e.target.value)}
            placeholder="예) 고추 잎이 노랗게 변하면서 말리고 있어요. 아랫잎부터 시작됨.&#10;예) 토마토 줄기에 흰 가루 같은 게 피어있어요.&#10;예) 오이 잎 뒤에 작은 벌레가 많아요."
            rows={3}
            style={{width:"100%",padding:"9px 12px",border:`1.5px solid ${C.sageLight}`,borderRadius:9,fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box",lineHeight:1.6}}
          />
        </div>

        {/* 진단 버튼 */}
        <button onClick={diag} disabled={loading||(!imgFile&&!userDesc.trim())}
          style={{width:"100%",padding:12,background:loading?C.inkLight:(!imgFile&&!userDesc.trim())?C.sageLight:`linear-gradient(135deg,${C.rose},${C.terra})`,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:14,cursor:loading||(!imgFile&&!userDesc.trim())?"not-allowed":"pointer"}}>
          {loading?"🔍 AI 진단 중...":"🩺 피해 진단 시작"}
        </button>
        {!imgFile&&!userDesc.trim()&&<div style={{fontSize:11,color:C.inkLight,textAlign:"center",marginTop:4}}>사진 또는 증상 설명 중 하나 이상 입력하세요</div>}

        {error&&<div style={{marginTop:8,background:C.roseLight,borderRadius:8,padding:"7px 10px",color:C.rose,fontSize:13}}>{error}</div>}

        {/* 진단 결과 */}
        {result?._truncated&&(
          <div style={{background:C.amberLight,borderRadius:8,padding:"6px 10px",marginBottom:8,fontSize:12,color:C.amber}}>
            ⚠️ 응답이 일부 잘렸습니다. 표시 가능한 정보만 보여드립니다.
          </div>
        )}
        {result&&(result.diagnosed===false?(
          <div style={{marginTop:12,background:C.amberLight,borderRadius:10,padding:14,textAlign:"center",color:C.amber}}>
            <div style={{fontSize:28,marginBottom:6}}>🤔</div>
            <div style={{fontWeight:600}}>{result.message}</div>
          </div>
        ):(
          <div style={{marginTop:12}}>
            {/* 문제 요약 */}
            <div style={{background:SEV[result.severity]?.bg||C.amberLight,borderRadius:12,padding:"12px 14px",marginBottom:10,border:`1px solid ${SEV[result.severity]?.border||C.amber}40`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <div>
                  <div style={{fontSize:11,color:C.inkLight,marginBottom:2}}>{result.cropName} · {result.problemType}</div>
                  <div style={{fontWeight:900,fontSize:18,color:C.ink}}>{result.problemName}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
                  <span style={{background:SEV[result.severity]?.color||C.amber,color:"#fff",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>피해 {result.severity}</span>
                  {result.urgency&&<span style={{background:URG[result.urgency]?.bg||C.amber,color:"#fff",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{URG[result.urgency]?.label||result.urgency}</span>}
                </div>
              </div>
              <p style={{fontSize:13,color:C.inkLight,margin:0,lineHeight:1.6}}>{result.description}</p>
              {result.symptoms?.length>0&&<div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>{result.symptoms.map(s=><span key={s} style={{background:"rgba(255,255,255,0.6)",borderRadius:20,padding:"2px 8px",fontSize:11,color:C.ink}}>• {s}</span>)}</div>}
            </div>

            {/* 농약 추천 - 친환경/화학 분리 */}
            {(result.pesticides?.eco_inventory?.length>0||result.pesticides?.chemical_inventory?.length>0||result.pesticides?.eco_recommend?.length>0||result.pesticides?.chemical_recommend?.length>0)&&(
              <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.terra}30`,padding:"10px 12px",marginBottom:8}}>
                <div style={{fontWeight:700,color:C.terra,marginBottom:10,fontSize:13}}>🐛 농약 추천</div>

                {/* 보유 중인 농약 */}
                {(result.pesticides?.eco_inventory?.length>0||result.pesticides?.chemical_inventory?.length>0)&&(
                  <div style={{background:C.tealLight+"50",borderRadius:8,padding:"8px 10px",marginBottom:8,border:`1px solid ${C.teal}30`}}>
                    <div style={{fontSize:11,color:C.teal,fontWeight:800,marginBottom:6}}>✅ 지금 바로 사용 가능 (보유 중)</div>
                    {renderPestList(result.pesticides.eco_inventory,true,true)}
                    {renderPestList(result.pesticides.chemical_inventory,true,false)}
                  </div>
                )}

                {/* 구매 권장 - 검색&등록 버튼 포함 */}
                {(result.pesticides?.eco_recommend?.length>0||result.pesticides?.chemical_recommend?.length>0)&&(
                  <div style={{background:C.cream,borderRadius:8,padding:"8px 10px",border:`1px solid ${C.sageLight}`}}>
                    <div style={{fontSize:11,color:C.inkLight,fontWeight:800,marginBottom:6}}>🛒 구매 권장 <span style={{fontWeight:400,fontSize:10}}>— 🔍 버튼으로 상세 검색 & 등록 가능</span></div>
                    {renderPestList(result.pesticides.eco_recommend,false,true)}
                    {renderPestList(result.pesticides.chemical_recommend,false,false)}
                  </div>
                )}
              </div>
            )}

            {/* 비료 추천 */}
            {(result.fertilizers?.fromInventory?.length>0||result.fertilizers?.additional?.length>0)&&(
              <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.sageDark}30`,padding:"10px 12px",marginBottom:8}}>
                <div style={{fontWeight:700,color:C.sageDark,marginBottom:8,fontSize:13}}>🌿 비료 추천</div>
                {result.fertilizers?.fromInventory?.length>0&&(

            {/* 예방법 */}
            {result.preventionTips&&(

};

const TYPE_LABEL_P={insecticide:"살충",fungicide:"살균",acaricide:"살비",herbicide:"제초",other:"기타"};

const PestTab=({pesticides,fertilizers,onAdd,onAddFert,onAskDelete,apiKey})=>{
  const[activeFilter,setActiveFilter]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[selIds,setSelIds]=useState([]);
  const[form,setForm]=useState({name:"",type:"insecticide",ecoClass:"eco",activeIngredient:"",target:"",dilution:"",preharvest:0,interval:5,notes:"",crops:"",caution:""});
  // 농약 이름 검색 상태
  const[searchQuery,setSearchQuery]=useState("");
  const[searchLoading,setSearchLoading]=useState(false);
  const[searchResult,setSearchResult]=useState(null);
  const[searchError,setSearchError]=useState("");

  // 농약 이름 검색 실행
  const runPestNameSearch=async()=>{
    if(searchLoading) return;  // 연타 방지
    const q=searchQuery.trim();
    if(!q) return;
    setSearchLoading(true);setSearchResult(null);setSearchError("");
    try{
      const r=await callGemini([{text:PEST_SEARCH_PROMPT(q)}],apiKey);
      setSearchResult(r);
    }catch(e){setSearchError("검색 오류: "+e.message);}
    finally{setSearchLoading(false);}
  };

  // 검색 결과 → 양식 자동 입력
  const applySearchResult=()=>{
    if(!searchResult||!searchResult.found) return;
    const sr=searchResult;
    setForm(f=>({...f,
      name:sr.name||f.name,
      type:sr.type||f.type,
      ecoClass:sr.ecoClass||f.ecoClass,
      activeIngredient:sr.activeIngredient||f.activeIngredient,
      dilution:sr.dilution||f.dilution,
      interval:sr.interval!=null?sr.interval:f.interval,
      preharvest:sr.preharvest!=null?sr.preharvest:f.preharvest,
      target:Array.isArray(sr.target)?sr.target.join(", "):f.target,
      crops:Array.isArray(sr.crops)?sr.crops.join(", "):f.crops,
      notes:sr.notes||f.notes,
      caution:sr.caution||f.caution,
    }));
    setSearchResult(null);setSearchQuery("");
  };

  // 검색 결과 바로 등록
  const registerSearchResult=()=>{
    if(!searchResult||!searchResult.found) return;
    const sr=searchResult;
    onAdd({
      id:Date.now(),name:sr.name,type:sr.type||"insecticide",ecoClass:sr.ecoClass||"chemical",
      activeIngredient:sr.activeIngredient||"",dilution:sr.dilution||"",
      interval:Number(sr.interval)||7,preharvest:Number(sr.preharvest)||3,
      target:Array.isArray(sr.target)?sr.target:[],
      crops:Array.isArray(sr.crops)&&sr.crops.length?sr.crops:["전작물"],
      notes:sr.notes||"",caution:sr.caution||""

    setSearchResult(null);setSearchQuery("");setShowForm(false);
  };

  const toggle=id=>setSelIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  const selItems=pesticides.filter(p=>selIds.includes(p.id));

  const cnt=(eco,type)=>pesticides.filter(p=>{
    const eOk=eco==="eco"?p.ecoClass==="eco":p.ecoClass==="chemical";
    if(type==="other") return eOk&&p.type!=="insecticide"&&p.type!=="fungicide";
    return eOk&&p.type===type;
  }).length;

  const getFiltered=()=>{
    if(!activeFilter) return [];
    if(activeFilter==="all") return pesticides;
    const[eco,type]=activeFilter.split("_");
    return pesticides.filter(p=>{
      const eOk=eco==="eco"?p.ecoClass==="eco":p.ecoClass==="chemical";
      if(type==="other") return eOk&&p.type!=="insecticide"&&p.type!=="fungicide";
      return eOk&&p.type===type;
    });
  };
  const filtered=getFiltered();

  const CatBtn=({id,label,color,count})=>{
    const active=activeFilter===id;
    return(
      <button onClick={()=>setActiveFilter(active?null:id)}
        style={{flex:1,padding:"6px 2px",borderRadius:8,border:"1.5px solid "+(active?color:color+"40"),background:active?color+"18":"#fff",cursor:"pointer",textAlign:"center"}}>
        <div style={{fontSize:17,fontWeight:900,color:active?color:C.inkLight,lineHeight:1}}>{count}</div>
        <div style={{fontSize:10,color:active?color:C.inkLight,fontWeight:active?700:400,marginTop:1}}>{label}</div>
      </button>
    );
  };

  const submit=()=>{
    if(!form.name.trim()) return;
    onAdd({...form,id:Date.now(),target:form.target?form.target.split(",").map(s=>s.trim()):[],crops:form.crops?form.crops.split(",").map(s=>s.trim()):["전작물"],preharvest:Number(form.preharvest),interval:Number(form.interval)});

    setShowForm(false);
  };

  const inputSt={width:"100%",padding:"7px 10px",border:"1px solid "+C.sageLight,borderRadius:7,fontSize:13,boxSizing:"border-box",fontFamily:"inherit",outline:"none"};

  return(

      <button onClick={()=>setShowForm(v=>!v)} style={{width:"100%",padding:10,background:showForm?C.inkLight:C.terra,color:"#fff",border:"none",borderRadius:11,fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:11}}>

      {showForm&&(
        <div style={{background:"#fff",borderRadius:13,border:"1px solid "+C.sageLight,padding:14,marginBottom:11}}>

          {/* ── AI 이름 검색 ── */}
          <div style={{background:C.roseLight,borderRadius:10,padding:"10px 12px",marginBottom:12,border:`1px dashed ${C.terra}60`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.terra,marginBottom:7}}>🔍 농약 이름으로 AI 검색 후 자동 입력</div>
            <div style={{display:"flex",gap:6}}>

              <button onClick={runPestNameSearch} disabled={searchLoading||!searchQuery.trim()}

                {searchLoading?"검색중…":"검색"}
              </button>
            </div>
            {searchError&&<div style={{fontSize:11,color:C.rose,marginTop:5}}>{searchError}</div>}
            {/* 검색 결과 */}
            {searchResult&&(searchResult.found===false?(
              <div style={{marginTop:8,fontSize:12,color:C.amber,background:C.amberLight,borderRadius:7,padding:"7px 10px"}}>🤔 {searchResult.message||"정보를 찾지 못했습니다."}</div>

          <div style={{display:"flex",gap:5}}>
            <CatBtn id="eco_insecticide" label="살충" color={C.teal} count={cnt("eco","insecticide")}/>
            <CatBtn id="eco_fungicide" label="살균" color={C.purple} count={cnt("eco","fungicide")}/>

        </div>
        {/* 화학 섹션 */}
        <div>
          <div style={{fontSize:11,fontWeight:700,color:C.terra,marginBottom:5}}>🧪 화학 ({pesticides.filter(p=>p.ecoClass==="chemical").length}종)</div>
          <div style={{display:"flex",gap:5}}>
            <CatBtn id="chem_insecticide" label="살충" color={C.terra} count={cnt("chemical","insecticide")}/>
            <CatBtn id="chem_fungicide" label="살균" color={C.purple} count={cnt("chemical","fungicide")}/>

      <div style={{background:C.goldLight+"50",borderRadius:7,padding:"5px 9px",marginBottom:9,fontSize:11,color:C.inkLight,border:"1px solid "+C.gold+"40"}}>

      </div>

      {activeFilter&&(
        <div>
          <div style={{fontSize:12,color:C.inkLight,fontWeight:700,marginBottom:7}}>
            {activeFilter==="all"?"전체 농약":activeFilter.startsWith("eco_")?
              "🌿 친환경 "+(activeFilter==="eco_insecticide"?"살충":activeFilter==="eco_fungicide"?"살균":"기타"):
              "🧪 화학 "+(activeFilter==="chem_insecticide"?"살충":activeFilter==="chem_fungicide"?"살균":"기타")}

          {filtered.length===0?(

};

/* ── 자재 탭 (비료 + 농약 통합) ── */
const SuppliesTab=({pesticides,fertilizers,onAddPest,onAddFert,onUpdatePest,onUpdateFert,onAskDelPest,onAskDelFert,apiKey})=>{
  const[sub,setSub]=useState("fert");
  const[plannedOpen,setPlannedOpen]=useState(true);
  const[showDiag,setShowDiag]=useState(true);
  // 구매예정 AI 검색 상태 {id: {loading, result, error, open}}
  const[planSearch,setPlanSearch]=useState({});

  const plannedFerts=fertilizers.filter(f=>f.status==="planned");
  const plannedPests=pesticides.filter(p=>p.status==="planned");
  const totalPlanned=plannedFerts.length+plannedPests.length;
  const haveFerts=fertilizers.filter(f=>f.status!=="planned");
  const havePests=pesticides.filter(p=>p.status!=="planned");

  // 구매예정 항목에서 AI 검색
  const searchPlanned=async(item)=>{
    const isF=item._type==="fert";
    if(planSearch[item.id]?.loading) return;  // 연타 방지
    const prompt=isF?FERT_SEARCH_PROMPT(item.name):PEST_SEARCH_PROMPT(item.name);
    setPlanSearch(prev=>({...prev,[item.id]:{loading:true,result:null,error:null,open:true}}));
    try{
      const r=await callGemini([{text:prompt}],apiKey);
      setPlanSearch(prev=>({...prev,[item.id]:{...prev[item.id],loading:false,result:r}}));
    }catch(e){
      setPlanSearch(prev=>({...prev,[item.id]:{...prev[item.id],loading:false,error:e.message}}));
    }
  };

  // 구매완료 → "have"로 변경 (상세정보 업데이트 포함)
  const completePurchase=(item,detailResult)=>{
    const isF=item._type==="fert";
    if(isF){
      const updates=detailResult&&detailResult.found!==false?{
        status:"have",npk:detailResult.npk||item.npk,form:detailResult.form||item.form,
        usage:detailResult.usage||item.usage,amount:detailResult.amount||item.amount,
        timing:detailResult.timing||item.timing,effect:detailResult.effect||item.effect,
        notes:detailResult.notes||item.notes,caution:detailResult.caution||item.caution,
        category:detailResult.category||item.category,
      }:{status:"have"};
      onUpdateFert(item.id,updates);
    }else{
      const updates=detailResult&&detailResult.found!==false?{
        status:"have",activeIngredient:detailResult.activeIngredient||item.activeIngredient,
        dilution:detailResult.dilution||item.dilution,interval:detailResult.interval||item.interval,
        preharvest:detailResult.preharvest||item.preharvest,
        target:detailResult.target?.length?detailResult.target:item.target,
        crops:detailResult.crops?.length?detailResult.crops:item.crops,
        notes:detailResult.notes||item.notes,caution:detailResult.caution||item.caution,
        type:detailResult.type||item.type,ecoClass:detailResult.ecoClass||item.ecoClass,
      }:{status:"have"};
      onUpdatePest(item.id,updates);
    }
    setPlanSearch(prev=>{const n={...prev};delete n[item.id];return n;});
  };

  // 구매예정 카드
  const PlannedCard=({item})=>{
    const isF=item._type==="fert";
    const sr=planSearch[item.id];
    const icon=isF?"🌿":"🐛";
    const color=isF?C.sageDark:C.terra;
    const typeBg=isF?C.sageLight+"60":C.roseLight;
    return(
      <div style={{background:"#fff",borderRadius:10,border:`1.5px solid ${color}30`,overflow:"hidden",marginBottom:8}}>
        <div style={{padding:"9px 12px"}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:18,flexShrink:0}}>{icon}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13,color:C.ink}}>{item.name}</div>
              <div style={{fontSize:10,color:C.inkLight,marginTop:1}}>
                {isF?(item.npk&&item.npk!=="-"?item.npk+" · ":"")+(item.usage||"비료")
                  :(item.ecoClass==="eco"?"친환경 ":"화학 ")+(TYPE_LABEL_P[item.type]||"농약")}
                {item.notes&&item.notes!=="AI 진단 추천"?" · "+item.notes:""}
              </div>
            </div>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              <button onClick={()=>completePurchase(item,null)}
                style={{fontSize:10,background:C.teal,color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>
                ✅ 구매완료
              </button>
              <button onClick={()=>searchPlanned(item)}
                disabled={sr&&sr.loading}
                style={{fontSize:10,background:sr&&sr.loading?C.sageLight:color,color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>
                {sr&&sr.loading?"검색중…":"🔍 검색"}
              </button>
              <button onClick={()=>(isF?onAskDelFert:onAskDelPest)(item.id,`"${item.name}" 구매예정을 삭제할까요?`,"삭제")}
                style={{background:"none",border:"none",cursor:"pointer",color:C.inkLight,fontSize:14,padding:"4px 4px",lineHeight:1}}>✕</button>
            </div>
          </div>
        </div>
        {/* 검색 결과 */}
        {sr&&(
          <div style={{borderTop:`1px solid ${color}20`,padding:"8px 12px",background:typeBg}}>
            {sr.loading&&<div style={{fontSize:11,color:C.inkLight,textAlign:"center",padding:"4px 0"}}>⏳ AI 검색 중...</div>}
            {sr.error&&<div style={{fontSize:11,color:C.rose}}>{sr.error}</div>}
            {sr.result&&(sr.result.found===false?(
              <div style={{fontSize:11,color:C.amber}}>🤔 {sr.result.message}</div>
            ):(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:7}}>
                  {isF?[["NPK",sr.result.npk],["사용법",sr.result.usage],["시비량",sr.result.amount],["효과",sr.result.effect]]
                      :[["유효성분",sr.result.activeIngredient],["희석배율",sr.result.dilution],["살포간격",sr.result.interval!=null?sr.result.interval+"일":null],["수확전",sr.result.preharvest!=null?sr.result.preharvest+"일":null]]
                    .filter(([,v])=>v).map(([l,v])=>(
                    <div key={l} style={{background:"#fff",borderRadius:5,padding:"4px 7px"}}>
                      <div style={{fontSize:9,color:C.inkLight}}>{l}</div>
                      <div style={{fontSize:11,fontWeight:600,color:C.ink}}>{v}</div>
                    </div>
                  ))}
                </div>
                {sr.result.caution&&<div style={{fontSize:10,color:C.rose,marginBottom:7}}>⚠️ {sr.result.caution}</div>}
                <button onClick={()=>completePurchase(item,sr.result)}
                  style={{width:"100%",padding:"8px 0",background:color,color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  ✅ 상세정보 반영 후 구매완료
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  return(
    <div>
      {/* ── AI 작물 피해 진단 (최상단) ── */}
      <div style={{marginBottom:14}}>
        <button onClick={()=>setShowDiag(v=>!v)}
          style={{width:"100%",padding:"11px 16px",background:`linear-gradient(135deg,${C.rose},${C.terra})`,color:"#fff",border:"none",borderRadius:12,fontWeight:700,fontSize:14,cursor:"pointer",display:"flex",justifyContent:"center",alignItems:"center",gap:8,boxShadow:"0 3px 10px rgba(180,70,70,0.25)"}}>
          <span>🔬 AI 작물 피해 진단</span>
          <span style={{opacity:0.75,fontSize:11,marginLeft:"auto"}}>{showDiag?"▲ 접기":"▼ 열기"}</span>
        </button>
        {showDiag&&(
          <div style={{marginTop:6}}>
            <DiagPanel pesticides={pesticides} fertilizers={fertilizers} apiKey={apiKey} onAddPest={onAddPest} onAddFert={onAddFert}/>
          </div>
        )}
      </div>

      {/* ── 구매예정 섹션 ── */}
      {totalPlanned>0&&(
        <div style={{background:"#fff",borderRadius:14,border:`2px solid ${C.amber}`,marginBottom:14,overflow:"hidden",boxShadow:"0 2px 10px rgba(196,125,10,0.12)"}}>
          <div onClick={()=>setPlannedOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",cursor:"pointer",background:`linear-gradient(135deg,${C.amberLight},#fff)`}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:18}}>🛒</span>
              <div>
                <div style={{fontWeight:800,fontSize:14,color:C.amber}}>구매예정</div>
                <div style={{fontSize:10,color:C.inkLight,marginTop:1}}>
                  {plannedPests.length>0&&`농약 ${plannedPests.length}종`}
                  {plannedPests.length>0&&plannedFerts.length>0&&" · "}
                  {plannedFerts.length>0&&`비료 ${plannedFerts.length}종`}
                </div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{background:C.amber,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:12,fontWeight:700}}>{totalPlanned}</span>
              <span style={{fontSize:12,color:C.inkLight}}>{plannedOpen?"▲":"▼"}</span>
            </div>
          </div>
          {plannedOpen&&(
            <div style={{padding:"8px 12px 12px"}}>
              <div style={{fontSize:10,color:C.inkLight,marginBottom:8,background:C.amberLight,borderRadius:6,padding:"4px 8px"}}>
                💡 🔍 검색으로 세부정보 확인 후 구매완료, 또는 바로 ✅ 구매완료
              </div>
              {plannedPests.length>0&&(
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.terra,marginBottom:6}}>🐛 농약 구매예정</div>
                  {plannedPests.map(p=><PlannedCard key={p.id} item={{...p,_type:"pest"}}/>)}
                </div>
              )}
              {plannedFerts.length>0&&(
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:C.sageDark,marginBottom:6}}>🌿 비료 구매예정</div>
                  {plannedFerts.map(f=><PlannedCard key={f.id} item={{...f,_type:"fert"}}/>)}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── 세그먼트 컨트롤 ── */}
      <div style={{display:"flex",background:"#fff",borderRadius:14,border:`1px solid ${C.sageLight}`,padding:4,marginBottom:14,gap:4,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
        {[
          {id:"fert",icon:"🌿",label:"비료",count:haveFerts.length,active:C.sageDark},
          {id:"pest",icon:"🐛",label:"농약",count:havePests.length,active:C.terra},
        ].map(s=>(
          <button key={s.id} onClick={()=>setSub(s.id)}
            style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
              background:sub===s.id?s.active:"transparent",
              color:sub===s.id?"#fff":C.inkLight,
              transition:"all 0.18s",
              display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <span style={{fontSize:16}}>{s.icon}</span>
            <span>{s.label}</span>
            <span style={{
              background:sub===s.id?"rgba(255,255,255,0.3)":C.sageLight+"80",
              color:sub===s.id?"#fff":C.inkLight,
              borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:700,minWidth:20,textAlign:"center"}}>
              {s.count}
            </span>
          </button>
        ))}
      </div>

      {/* 내용 — display:none으로 양쪽 state 유지 */}
      <div style={{display:sub==="fert"?"block":"none"}}>
        <FertTab fertilizers={haveFerts} onAdd={onAddFert} onAskDelete={onAskDelFert} apiKey={apiKey}/>
      </div>
      <div style={{display:sub==="pest"?"block":"none"}}>
        <PestTab pesticides={havePests} fertilizers={haveFerts} onAdd={onAddPest} onAddFert={onAddFert} onAskDelete={onAskDelPest} apiKey={apiKey}/>
      </div>
    </div>
  );
};

/* ── 메인 앱 ── */
function App(){
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem("gemini_api_key")||"");
  const[tab,setTab]=useState("garden");
  const[garden,setGarden]=useState(()=>loadStorage("garden_v1", DEFAULT_GARDEN));
  const[diary,setDiary]=useState(()=>loadStorage("diary_v1", []));
  const[fertilizers,setFertilizers]=useState(DEFAULT_FERTILIZERS);
  const[pesticides,setPesticides]=useState(DEFAULT_PESTICIDES);
  const[weather,setWeather]=useState(null);
  const[daily,setDaily]=useState([]);
  const[wLoading,setWLoading]=useState(false);
  const[wError,setWError]=useState(false);
  const[confirm,setConfirm]=useState({open:false,title:"",message:"",onConfirm:null});

  const saveKey=key=>{localStorage.setItem("gemini_api_key",key);setApiKey(key);};
  const closeConfirm=useCallback(()=>setConfirm(c=>({...c,open:false,onConfirm:null})),[]);

  const askDel=(payload,message,title,delFn)=>setConfirm({open:true,title,message,onConfirm:()=>{delFn(payload);setConfirm(c=>({...c,open:false}));}});
  const askDelGarden=(name,msg,title)=>askDel(name,msg,title,n=>setGarden(prev=>prev.filter(p=>p.koreanName!==n)));
  const askDelFert=(id,msg,title)=>askDel(id,msg,title,i=>setFertilizers(prev=>prev.filter(f=>f.id!==i)));
  const askDelPest=(id,msg,title)=>askDel(id,msg,title,i=>setPesticides(prev=>prev.filter(p=>p.id!==i)));
  const askDelDiary=(id,msg,title)=>askDel(id,msg,title,i=>setDiary(prev=>prev.filter(d=>d.id!==i)));

  useEffect(()=>{fetchWeather();},[]);
  useEffect(()=>{saveStorage("garden_v1", garden);},[garden]);
  useEffect(()=>{saveStorage("diary_v1", diary);},[diary]);

  const fetchWeather=async()=>{
    setWLoading(true);setWError(false);
    const kmaKey=loadStorage("kma_api_key","");
    const owmKey=loadStorage("owm_api_key","");
    try{
      const now=new Date();
      if(kmaKey){
        // ── 기상청 단기예보 (가장 정확) ──
        const grid=latLonToGrid(35.0226,126.7895); // 나주 빛가람동
        const {base_date,base_time}=getKmaBaseTime();
        // serviceKey는 이미 인코딩된 값이므로 직접 URL 조합 (이중 인코딩 방지)
        const apiUrl=`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst`
          +`?serviceKey=${kmaKey}`
          +`&numOfRows=300&pageNo=1`
          +`&base_date=${base_date}&base_time=${base_time}`
          +`&nx=${grid.nx}&ny=${grid.ny}&dataType=JSON`;
        const res=await fetch(apiUrl);
        if(!res.ok){
          const errText=await res.text().catch(()=>"");
          throw new Error(`기상청 HTTP 오류 ${res.status}: ${errText.slice(0,100)}`);
        }
        const data=await res.json();
        const items=data.response?.body?.items?.item||[];
        // 기상청 응답 에러코드 확인
        const resultCode=data.response?.header?.resultCode;
        const resultMsg=data.response?.header?.resultMsg||"";
        if(resultCode&&resultCode!=="00"){
          throw new Error(`기상청 오류 [${resultCode}]: ${resultMsg}`);
        }
        if(!items.length) throw new Error("기상청 데이터 없음 (base_date:"+base_date+" base_time:"+base_time+")");

        // 항목별 파싱
        const byDateTime={};
        items.forEach(item=>{
          const key=`${item.fcstDate}_${item.fcstTime}`;
          if(!byDateTime[key]) byDateTime[key]={date:item.fcstDate,time:item.fcstTime};
          byDateTime[key][item.category]=item.fcstValue;
        });

        // 현재 시각에 가장 가까운 데이터
        const todayStr=now.toISOString().replace(/[-T:]/g,"").slice(0,8);
        const currentTimeStr=String(now.getHours()).padStart(2,"0")+"00";
        const todayEntries=Object.values(byDateTime)
          .filter(e=>e.date===todayStr)
          .sort((a,b)=>a.time.localeCompare(b.time));

        const current=todayEntries.find(e=>e.time>=currentTimeStr)||todayEntries[0]||{};
        const sky=parseInt(current.SKY||1), pty=parseInt(current.PTY||0);
        const wi=kmaWeatherInfo(sky,pty);

        // 3시간 단위 예보 슬롯
        const allEntries=Object.values(byDateTime).sort((a,b)=>
          (a.date+a.time).localeCompare(b.date+b.time));
        const slots=[];
        const seen=new Set();
        allEntries.forEach(e=>{
          const h=parseInt(e.time.slice(0,2));
          const key=`${e.date}_${h}`;
          if(seen.has(key)) return;
          if(h%3!==0) return;
          seen.add(key);
          const eDate=new Date(
            parseInt(e.date.slice(0,4)),parseInt(e.date.slice(4,6))-1,parseInt(e.date.slice(6,8)),h);
          const isSky=parseInt(e.SKY||1), isPty=parseInt(e.PTY||0);
          const si=kmaWeatherInfo(isSky,isPty);
          const label=h===0?"자정":h<12?`오전 ${h}시`:h===12?"정오":`오후 ${h-12}시`;
          slots.push({
            hour:h, label,
            temp:Math.round(parseFloat(e.TMP||e.T1H||0)),
            feelsLike:Math.round(parseFloat(e.TMP||e.T1H||0)), // 기상청 체감온도는 별도 API
            precipProb:parseInt(e.POP||0),
            kmaIcon:si.icon, kmaLabel:si.label,
            wind:Math.round(parseFloat(e.WSD||0)),
            isPast:eDate<now&&(now-eDate)>5400000,
            isCurrent:Math.abs(eDate-now)<5400000,
            dateLabel:eDate.getDate()!==now.getDate()?`${eDate.getMonth()+1}/${eDate.getDate()}`:null,
          });
          if(slots.length>=12) return;
        });

        const currentSlot=slots.find(s=>s.isCurrent)||slots[0];
        const curTemp=parseFloat(current.TMP||current.T1H||0)||
          (currentSlot?currentSlot.temp:0);
        setWeather({
          temperature:Math.round(curTemp),
          feelsLike:Math.round(curTemp),
          precipitation:parseFloat(current.PCP==="강수없음"?0:current.PCP||0),
          kmaIcon:wi.icon, kmaLabel:wi.label,
          humidity:parseInt(current.REH||0),
          wind:Math.round(parseFloat(current.WSD||0)),
          hourly:slots.slice(0,8),
          todayMin:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          todayMax:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          tmrMin:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          tmrMax:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          source:"KMA",
          updatedAt:now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),
        });
      } else if(owmKey){
        // ── OpenWeatherMap (정확도 높음) ──
        const [curRes,fcRes]=await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?lat=35.0226&lon=126.7895&appid=${owmKey}&units=metric&lang=kr`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=35.0226&lon=126.7895&appid=${owmKey}&units=metric&lang=kr&cnt=16`)
        ]);
        if(!curRes.ok) throw new Error("OWM 오류 "+curRes.status);
        const cur=await curRes.json(), fc=await fcRes.json();
        const currentHour=now.getHours();
        const slots=(fc.list||[]).map(item=>{
          const dt=new Date(item.dt*1000);
          const h=dt.getHours();
          const label=h===0?"자정":h<12?`오전 ${h}시`:h===12?"정오":`오후 ${h-12}시`;
          return{
            hour:h, label,
            temp:Math.round(item.main.temp),
            feelsLike:Math.round(item.main.feels_like),
            precipProb:Math.round((item.pop||0)*100),
            owmCode:item.weather[0]?.id||800,
            wind:Math.round(item.wind.speed*3.6),
            isPast:dt<now&&(now-dt)>5400000,
            isCurrent:Math.abs(dt-now)<5400000,
            dateLabel:dt.getDate()!==now.getDate()?`${dt.getMonth()+1}/${dt.getDate()}`:null,
          };
        });
        setWeather({
          temperature:Math.round(cur.main.temp),
          feelsLike:Math.round(cur.main.feels_like),
          precipitation:cur.rain?.["1h"]||0,
          owmCode:cur.weather[0]?.id||800,
          humidity:cur.main.humidity,
          wind:Math.round(cur.wind.speed*3.6),
          hourly:slots,
          todayMin:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          todayMax:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          tmrMin:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          tmrMax:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          source:"OWM",
          updatedAt:now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),
        });
      } else {
        // ── Open-Meteo (키 없이 무료) ──
        const url=`https://api.open-meteo.com/v1/forecast?latitude=35.0226&longitude=126.7895`
          +`&current=temperature_2m,apparent_temperature,precipitation,weathercode,relative_humidity_2m,wind_speed_10m`
          +`&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode,wind_speed_10m`
          +`&timezone=Asia%2FSeoul&forecast_days=2`;
        const res=await fetch(url),data=await res.json(),c=data.current;
        const currentHour=now.getHours();
        const slots=[];
        for(let i=0;i<24;i+=1){
          const todayStr=now.toISOString().split("T")[0];
          const timeStr=`${todayStr}T${String(i).padStart(2,"0")}:00`;
          const idx=data.hourly.time.indexOf(timeStr);
          if(idx>=0) slots.push({
            hour:i,
            label:i===0?"자정":i<12?`오전 ${i}시`:i===12?"정오":`오후 ${i-12}시`,
            temp:Math.round(data.hourly.temperature_2m[idx]),
            feelsLike:Math.round(data.hourly.apparent_temperature[idx]),
            precipProb:data.hourly.precipitation_probability[idx],
            weathercode:data.hourly.weathercode[idx],
            wind:Math.round(data.hourly.wind_speed_10m[idx]),
            isPast:i<currentHour,
            isCurrent:i===currentHour,
          });
        }
        setWeather({
          temperature:Math.round(c.temperature_2m),
          feelsLike:Math.round(c.apparent_temperature),
          precipitation:c.precipitation,
          weathercode:c.weathercode,
          humidity:c.relative_humidity_2m,
          wind:Math.round(c.wind_speed_10m),
          hourly:slots,
          todayMin:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          todayMax:(()=>{const t=slots.filter(s=>!s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          tmrMin:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.min(...t.map(s=>s.temp)):null;})(),
          tmrMax:(()=>{const t=slots.filter(s=>s.dateLabel);return t.length?Math.max(...t.map(s=>s.temp)):null;})(),
          source:"OM",
          updatedAt:now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),
        });
      }
    }catch(e){setWError(e.message||true);console.error(e);}finally{setWLoading(false);}
    // ── 7일 일별 예보 (Open-Meteo, 항상 fetch) ──
    try{
      const du=`https://api.open-meteo.com/v1/forecast?latitude=35.0226&longitude=126.7895`
        +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode`
        +`&hourly=temperature_2m,precipitation_probability,weathercode,wind_speed_10m`
        +`&timezone=Asia%2FSeoul&forecast_days=7`;
      const dr=await fetch(du),dd=await dr.json();
      if(dd.daily){
        // 시간별 데이터를 날짜별로 그룹핑 (3시간 단위)
        const hourlyByDate={};
        if(dd.hourly){
          dd.hourly.time.forEach((t,i)=>{
            const date=t.slice(0,10);
            const hour=parseInt(t.slice(11,13));
            if(hour%3!==0) return; // 3시간 단위
            if(!hourlyByDate[date]) hourlyByDate[date]=[];
            const wc=WEATHER_CODES[dd.hourly.weathercode[i]]||{icon:"🌡️"};
            hourlyByDate[date].push({
              hour,
              label:hour===0?"자정":hour<12?`오전 ${hour}시`:hour===12?"정오":`오후 ${hour-12}시`,
              temp:Math.round(dd.hourly.temperature_2m[i]),
              precipProb:dd.hourly.precipitation_probability[i]||0,
              wind:Math.round((dd.hourly.wind_speed_10m[i]||0)),
              wcode:dd.hourly.weathercode[i],
              icon:wc.icon,
            });
          });
        }
        const days=dd.daily.time.map((t,i)=>({
          date:t,
          max:Math.round(dd.daily.temperature_2m_max[i]),
          min:Math.round(dd.daily.temperature_2m_min[i]),
          precipProb:dd.daily.precipitation_probability_max[i],
          wcode:dd.daily.weathercode[i],
          hourly:hourlyByDate[t]||[],
        }));
        setDaily(days);
        if(days.length>=2){
          setWeather(prev=>prev?{...prev,tmrMax:days[1].max,tmrMin:days[1].min}:prev);
        }
      }
    }catch(e){console.warn("일별예보 오류",e);}
  };

  const addToGarden=useCallback((plant,status="have")=>setGarden(prev=>prev.find(p=>p.koreanName===plant.koreanName)?prev:[...prev,{...plant,wateringDays:plant.wateringDays||3,lastWatered:null,status}]),[]);
  const markWatered=useCallback(name=>setGarden(prev=>prev.map(p=>p.koreanName===name?{...p,lastWatered:todayStr()}:p)),[]);
  const changeInterval=useCallback((name,days)=>setGarden(prev=>prev.map(p=>p.koreanName===name?{...p,wateringDays:days}:p)),[]);
  const updatePlant=useCallback((name,updates)=>setGarden(prev=>prev.map(p=>p.koreanName===name?{...p,...updates}:p)),[]);
  const addDiary=useCallback(e=>setDiary(prev=>[...prev,e]),[]);
  const addFert=useCallback(f=>setFertilizers(prev=>[...prev,f]),[]);
  const addPest=useCallback(p=>setPesticides(prev=>[...prev,p]),[]);
  const updateFert=useCallback((id,updates)=>setFertilizers(prev=>prev.map(f=>f.id===id?{...f,...updates}:f)),[]);
  const updatePest=useCallback((id,updates)=>setPesticides(prev=>prev.map(p=>p.id===id?{...p,...updates}:p)),[]);

  if(!apiKey) return <ApiKeySetup onSave={saveKey}/>;

  const overdueCount=garden.filter(p=>{const s=p.status||"have";return(s==="have"||!s)&&getDaysUntilWatering(p)<=0;}).length;

  const plannedCount=(fertilizers.filter(f=>f.status==="planned").length)+(pesticides.filter(p=>p.status==="planned").length);
  const ownedCount=(fertilizers.filter(f=>f.status!=="planned").length)+(pesticides.filter(p=>p.status!=="planned").length);

  const TABS=[{id:"garden",label:"🌱 정원",badge:overdueCount},{id:"caldiary",label:"📅 달력·일지"},{id:"plant",label:"🔍 식물"},{id:"supplies",label:"🌿 자재",badge:ownedCount,plannedBadge:plannedCount}];
  const tabSt=id=>({flex:1,padding:"10px 0",textAlign:"center",fontWeight:700,fontSize:11,border:"none",cursor:"pointer",borderBottom:tab===id?`3px solid ${C.sageDark}`:"3px solid transparent",background:tab===id?C.sage+"15":"transparent",color:tab===id?C.sageDark:C.inkLight,transition:"all 0.2s",whiteSpace:"nowrap"});

  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${C.cream} 0%,#EFF5EB 100%)`,fontFamily:"'Apple SD Gothic Neo','Noto Sans KR',sans-serif"}}>
      <ConfirmDlg open={confirm.open} title={confirm.title} message={confirm.message} onConfirm={confirm.onConfirm} onCancel={closeConfirm}/>
      <div style={{background:`linear-gradient(135deg,${C.moss} 0%,${C.sageDark} 100%)`,padding:"14px 20px 10px",textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.15)"}}>
        <div style={{fontSize:22,marginBottom:2}}>🌿</div>
        <div style={{fontSize:19,fontWeight:900,color:"#fff",letterSpacing:-0.5}}>나의 정원 도감</div>
        <div style={{fontSize:10,color:C.sageLight,marginTop:2,opacity:0.9}}>Powered by Gemini · 식물·정원·달력·일지·비료·농약</div>
        <button onClick={()=>{if(confirm("API 키를 초기화하고 로그아웃하시겠습니까?")){localStorage.removeItem("gemini_api_key");setApiKey("");}}} style={{position:"absolute",right:14,top:14,background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",borderRadius:6,padding:"3px 8px",fontSize:10,cursor:"pointer"}}>키 변경</button>
      </div>
      <div style={{display:"flex",background:"#fff",borderBottom:`1px solid ${C.sageLight}50`,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} style={tabSt(t.id)} onClick={()=>setTab(t.id)}>
            {t.label}
            {t.badge>0&&<span style={{background:t.id==="garden"?C.terra:C.sage,color:"#fff",borderRadius:"50%",width:14,height:14,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9,marginLeft:2}}>{t.badge}</span>}
            {t.plannedBadge>0&&<span style={{background:C.amber,color:"#fff",borderRadius:"50%",width:14,height:14,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9,marginLeft:1}}>🛒</span>}
          </button>
        ))}
      </div>
      <div style={{padding:16,maxWidth:480,margin:"0 auto"}}>
        {tab==="plant"&&<PlantTab garden={garden} onAdd={addToGarden} apiKey={apiKey}/>}
        {tab==="garden"&&<GardenTab garden={garden} weather={weather} daily={daily} wLoading={wLoading} wError={wError} onRefresh={fetchWeather} overdueCount={overdueCount} onAskDelete={askDelGarden} onWatered={markWatered} onChangeInterval={changeInterval} onUpdatePlant={updatePlant} onAdd={addToGarden} setGarden={setGarden} goSearch={()=>setTab("plant")}/>}
        {tab==="caldiary"&&<CalDiaryTab garden={garden} diary={diary} onAdd={addDiary} onAskDelete={askDelDiary}/>}
        {tab==="supplies"&&<SuppliesTab pesticides={pesticides} fertilizers={fertilizers} onAddPest={addPest} onAddFert={addFert} onUpdatePest={updatePest} onUpdateFert={updateFert} onAskDelPest={askDelPest} onAskDelFert={askDelFert} apiKey={apiKey}/>}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>

<!-- PWA 서비스워커 + 설치 안내 -->
<script>
// ── 서비스워커 등록 (오프라인 캐시) ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ── 홈 화면 추가 배너 ──
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  showInstallBanner();
});

function showInstallBanner(){
  if(document.getElementById('pwa-banner')) return;
  const banner=document.createElement('div');
  banner.id='pwa-banner';
  banner.style.cssText=`
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    background:#4D7A52;color:#fff;padding:12px 18px;border-radius:14px;
    display:flex;align-items:center;gap:12px;z-index:9999;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);font-size:13px;
    max-width:320px;width:90%;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  `;
  banner.innerHTML=`
    <span style="font-size:22px">🌿</span>
    <div style="flex:1">
      <div style="font-weight:700;margin-bottom:2px">앱으로 설치하기</div>
      <div style="opacity:0.85;font-size:11px">홈 화면에 추가하면 앱처럼 사용할 수 있어요</div>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button id="pwa-install" style="background:#fff;color:#4D7A52;border:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer">설치</button>
      <button id="pwa-close" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer">✕</button>
    </div>
  `;
  document.body.appendChild(banner);
  document.getElementById('pwa-install').onclick=async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    deferredPrompt=null;
    banner.remove();
  };
  document.getElementById('pwa-close').onclick=()=>banner.remove();
}

// 이미 설치됐으면 배너 숨김
window.addEventListener('appinstalled',()=>{
  const b=document.getElementById('pwa-banner');
  if(b) b.remove();
});
</script>
</body>
